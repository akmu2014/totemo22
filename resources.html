<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Additional Resources • Monument Vibe</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted: rgba(255,255,255,.72);
      --border: rgba(255,255,255,.18);
      --border2: rgba(255,255,255,.40);
      --shadow: 0 12px 30px rgba(0,0,0,.55);
      --radius: 22px;
      --maxw: 980px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap{
      min-height:100%;
      display:flex;
      justify-content:center;
      padding:24px;
    }
    .container{
      width:100%;
      max-width:var(--maxw);
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size: clamp(26px, 4.8vw, 42px);
      letter-spacing:.4px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      color:var(--fg);
      text-decoration:none;
      font-size:14px;
      white-space:nowrap;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: var(--border2);
      background: rgba(255,255,255,.12);
    }

    /* Boxes */
    .stack{
      display:grid;
      grid-template-columns: 1fr;
      gap:16px;
    }

    .box{
      border-radius: var(--radius);
      overflow:hidden;
      border:1px solid var(--border);
      box-shadow: var(--shadow);
      background:#111;
      transition: transform 180ms ease, border-color 180ms ease;
    }
    .box:hover{
      transform: translateY(-2px);
      border-color: var(--border2);
    }

    .box-title{
      margin:0;
      padding:16px 18px;
      font-size: clamp(20px, 4vw, 28px);
      font-weight:800;
      letter-spacing:.4px;
      text-align:center;
    }

    .box-img{
      display:block;
      height:200px;
      overflow:hidden;
    }
    .box-img img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: brightness(.85) contrast(1.05);
      transition: filter 180ms ease;
    }
    .box-img:hover img{
      filter: brightness(1) contrast(1.05);
    }

    .box-link{
      display:flex;
      justify-content:center;
      padding:16px 18px;
    }

    @media (max-width:360px){
      .wrap{ padding:16px; }
      .stack{ gap:12px; }
      .box-img{ height:160px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="container">

      <header>
        <h1>Additional Resources</h1>
        <a class="btn" href="note.html">← Back</a>
      </header>

      <section class="stack" aria-label="Resources">

        <!-- Kids Vocabulary -->
        <article class="box">
          <h2 class="box-title">Kids Vocabulary</h2>
          <a class="box-img" href="https://podcasts.apple.com/us/podcast/vocabulary-for-kids/id6804897159" target="_blank" rel="noopener">
            <img src="Note_images/image4.jpg" alt="Kids Vocabulary podcast" loading="lazy" />
          </a>
          <div class="box-link">
            <a class="btn" href="https://podcasts.apple.com/us/podcast/vocabulary-for-kids/id6804897159" target="_blank" rel="noopener">Listen on Apple Podcasts ↗</a>
          </div>
        </article>

        <!-- Kids Science -->
        <article class="box">
          <h2 class="box-title">Kids Science</h2>
          <a class="box-img" href="https://podcasts.apple.com/us/podcast/science-bees-kids/id6816580125" target="_blank" rel="noopener">
            <img src="Note_images/image5.jpg" alt="Kids Science podcast" loading="lazy" />
          </a>
          <div class="box-link">
            <a class="btn" href="https://podcasts.apple.com/us/podcast/science-bees-kids/id6816580125" target="_blank" rel="noopener">Listen on Apple Podcasts ↗</a>
          </div>
        </article>

        <!-- Other Stuff -->
        <article class="box">
          <h2 class="box-title">Other Stuff</h2>
          <a class="box-img" href="otherstuff.html">
            <img src="Note_images/image6.jpg" alt="Other Stuff" loading="lazy" />
          </a>
          <div class="box-link">
            <a class="btn" href="otherstuff.html">Open →</a>
          </div>
        </article>

      </section>
    </main>
  </div>
</body>
</html>
