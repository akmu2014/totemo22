<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Science Bee">
<meta name="theme-color" content="#12372a">
<title>Science Bee Practice</title>
<style>
:root{
  --bg:#f4f8f5; --card:#ffffff; --ink:#12372a; --muted:#5d6f66; --line:#d3e1d9;
  --green:#0b7a4b; --green-ink:#ffffff; --red:#b3261e; --chip:#e5f0ea; --chip-on:#12372a; --chip-on-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1814; --card:#16241e; --ink:#e6f1ea; --muted:#9bb0a5; --line:#2a3d34;
    --green:#3ecf8e; --green-ink:#062417; --red:#ff7b72; --chip:#1d2f27; --chip-on:#3ecf8e; --chip-on-ink:#062417; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.screen{min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

/* menu */
#menu{max-width:860px;margin:0 auto}
h1{font-size:clamp(28px,5vw,40px);margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:17px}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:12px 18px;font-size:18px;min-height:48px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip small{opacity:.7;margin-left:6px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:12px 18px;font-size:18px;min-height:48px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.row{display:flex;flex-wrap:wrap;gap:22px 34px}
.primary{background:var(--green);color:var(--green-ink);border:0;border-radius:16px;padding:16px 38px;font-size:22px;font-weight:700;min-height:56px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;font-size:17px;min-height:48px}
.actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* quiz */
#quiz{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px}
.top .meta{flex:1;color:var(--muted);font-size:16px;line-height:1.3}
#timer{font-size:30px;font-weight:800;color:var(--red);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:20px 4px;max-width:1000px;width:100%;margin:0 auto;text-align:center}
#qtext{font-size:clamp(28px,4.6vw,52px);font-weight:750;line-height:1.2;margin:0}
#answer{font-size:clamp(26px,4.2vw,46px);font-weight:800;color:var(--green);margin:0;line-height:1.2;
  background:var(--card);border:2px solid var(--green);border-radius:20px;padding:22px 26px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#answer.show{opacity:1;transform:none}
#hint{color:var(--muted);font-size:18px;min-height:26px}
#score-btns{display:flex;gap:16px;justify-content:center}
#score-btns button{flex:1;max-width:280px;border:0;border-radius:18px;padding:20px;font-size:24px;font-weight:800;min-height:68px}
#got{background:var(--green);color:var(--green-ink)}
#miss{background:var(--red);color:#fff}
@media (prefers-color-scheme: dark){#miss{color:#2a0805}}

/* done */
#done{max-width:640px;margin:0 auto;text-align:center;padding-top:12vh}
#done h1{font-size:44px}
.big{font-size:30px;margin:10px 0}
</style>
</head>
<body>

<section id="menu" class="screen">
  <h1>Science Bee Practice</h1>
  <p class="sub">2,000 questions &bull; tap to reveal answers &bull; works offline once loaded</p>

  <h2>Categories <span style="text-transform:none;letter-spacing:0">(none selected = all)</span></h2>
  <div class="chips" id="cats"></div>

  <div class="row">
    <div><h2>Order</h2><div class="seg" id="seg-order"></div></div>
    <div><h2>Score myself</h2><div class="seg" id="seg-score"></div></div>
    <div><h2>Timer</h2><div class="seg" id="seg-time"></div></div>
    <div><h2>Questions</h2><div class="seg" id="seg-count"></div></div>
  </div>

  <div class="actions">
    <button class="primary" id="start">Start</button>
    <button class="ghost" id="review" hidden></button>
    <button class="ghost" id="clear-missed" hidden>Clear missed list</button>
  </div>
</section>

<section id="quiz" class="screen" hidden>
  <div class="top">
    <button class="ghost" id="menu-btn" aria-label="Back to menu">Menu</button>
    <div class="meta" id="meta"></div>
    <div id="timer" aria-live="off"></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="stage">
    <p id="qtext"></p>
    <p id="answer"></p>
    <div id="hint"></div>
    <div id="score-btns" hidden>
      <button id="got">Got it</button>
      <button id="miss">Missed</button>
    </div>
  </div>
</section>

<section id="done" class="screen" hidden>
  <h1>Nice work!</h1>
  <div class="big" id="result"></div>
  <p class="sub" id="saved"></p>
  <div class="actions" style="justify-content:center">
    <button class="primary" id="redo" hidden>Review missed</button>
    <button class="ghost" id="home">Back to menu</button>
  </div>
</section>

orms caves in limestone?","a":"Slightly acidic water dissolves the rock"},{"category":"Earth & Natural History","subtopic":"Caves","q":"In which state is Mammoth Cave, the longest known cave system?","a":"Kentucky"},{"category":"Earth & Natural History","subtopic":"Caves","q":"In which state are Carlsbad Caverns?","a":"New Mexico"},{"category":"Earth & Natural History","subtopic":"Caves","q":"Which flying mammals often roost in caves?","a":"Bats"},{"category":"Earth & Natural History","subtopic":"Caves","q":"What is the hobby of exploring caves called?","a":"Caving (spelunking)"},{"category":"Earth & Natural History","subtopic":"Caves","q":"What is the part of a cave with no sunlight called?","a":"Dark zone"},{"category":"Earth & Natural History","subtopic":"Caves","q":"Famous prehistoric cave paintings at Lascaux are in which country?","a":"France"},{"category":"Earth & Natural History","subtopic":"Caves","q":"What are cave animals that live their whole lives in the dark called?","a":"Troglobites"},{"category":"Earth & Natural History","subtopic":"Caves","q":"What mineral deposits build up stalactites and stalagmites?","a":"Calcite"},{"category":"Earth & Natural History","subtopic":"Glaciers","q":"What is a large, slowly moving mass of ice called?","a":"Glacier"},{"category":"Earth & Natural History","subtopic":"Glaciers","q":"What forms a glacier?","a":"Snow that builds up and is compressed into ice over many years"},{"category":"Earth & Natural History","subtopic":"Glaciers","q":"Which continent holds most of Earth's ice?","a":"Antarctica"},{"category":"Earth & Natural History","subtopic":"Glaciers","q":"What is a floating chunk of ice that broke off a glacier called?","a":"Iceberg"},{"category":"Earth & Natural History","subtopic":"Glaciers","q":"About how much of an iceberg is underwater?","a":"About 90 percent"},{"category":"Earth & Natural History","subtopic":"Glaciers","q":"Is iceberg ice made of salt water or fresh water?","a":"Fresh water"},{"category":"Ea  & Natural History","subtopic":"Natural Disasters","q":"What is a blizzard?","a":"A severe snowstorm with strong winds"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"What does the Japanese word \"tsunami\" mean?","a":"Harbor wave"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"What region of the central United States is nicknamed \"Tornado Alley\"?","a":"The Great Plains"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"Mount St. Helens erupted in 1980 in which state?","a":"Washington"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"Hurricane Katrina struck which U.S. city in 2005?","a":"New Orleans"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"Where is the safest place in a house during a tornado?","a":"A basement or lowest interior room"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"What is the calm center of a hurricane called?","a":"Eye"},{"category":"Earth & Natural History","subtopic":"Natural Disasters","q":"What natural disaster is caused by a build-up of dry brush and a spark?","a":"Wildfire"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"About what percent of Earth is covered by water?","a":"About 71 percent"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is the deepest known point in the ocean?","a":"Challenger Deep (Mariana Trench)"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"Why is ocean water salty?","a":"Rivers carry dissolved minerals from rocks into the sea"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What mainly causes ocean tides?","a":"The Moon's gravity"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"How many high tides happen in most places each day?","a":"Two"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What warm current flows along the eastern coast of the United States?","a":"Gulf Stream"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is the study of the oceans called?","a":"Oceanography"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is the shallow, gently sloping part of the seafloor near a coast called?","a":"Continental shelf"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is the smallest ocean?","a":"Arctic Ocean"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What mainly causes ocean waves?","a":"Wind"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is the name of the famous deep-sea submersible that explored the Titanic wreck in 1986?","a":"Alvin"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What does salinity measure?","a":"How salty water is"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is a long underwater mountain range where new crust forms?","a":"Mid-ocean ridge"},{"category":"Earth & Natural History","subtopic":"Oceanography","q":"What is the sunlit upper layer of the ocean called?","a":"Sunlight (euphotic) zone"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the study of water on Earth called?","a":"Hydrology"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What are the main steps of the water cycle?","a":"Evaporation, condensation, precipitation, collection"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is water stored beneath the ground called?","a":"Groundwater"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is an underground layer of rock that holds groundwater called?","a":"Aquifer"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"Which river carries the most water in the world?","a":"Amazon River"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the fan-shaped land formed where a river meets the sea?","a":"Delta"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the largest freshwater lake in the world by area?","a":"Lake Superior"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"About what percent of Earth's water is fresh water?","a":"About 3 percent"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the area of land that drains into a river called?","a":"Watershed"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the beginning of a river called?","a":"Source (headwaters)"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the release of water vapor from plant leaves called?","a":"Transpiration"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What is the tallest waterfall in the world?","a":"Angel Falls (Venezuela)"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"Which lake in Russia is the deepest in the world?","a":"Lake Baikal"},{"category":"Earth & Natural History","subtopic":"Hydrology: Water","q":"What do we call rainwater that flows over land into streams?","a":"Runoff"},{"category":"Earth & Natural History","subtopic":"Soil Science","q":"What is the top layer of soil, rich in nutrients, called?","a":"Topsoil"},{"category":"Earth & Natural History","subtopic":"Soil Science","q":"What are the three main sizes of soil particles?","a":"Sand, silt, and clay"},{"category":"Earth & Natural History","subtopic":"Soil Science","q":"Which soil particle is the smallest?","a":"Clay"},{"category":"Earth & Natural History","subtopic":"Soil Science","q":"What is the dark, rich material made of decayed plants and animals in soil?","a":"Humus"},{"category":"Earth & Natural History","subtopic":"Soil Science","q":"Which animals help soil by tunneling and mixing it?","a": ny organisms added much of the oxygen to Earth's air?","a":"Cyanobacteria"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"About how many years ago did the Cambrian explosion of animal life occur?","a":"About 540 million"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"Which era is known as the Age of Mammals?","a":"Cenozoic Era"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"Which era is known as the Age of Reptiles (dinosaurs)?","a":"Mesozoic Era"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"What is the tool called that divides Earth's history into eras and periods?","a":"Geologic time scale"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"Which mass extinction about 252 million years ago is called \"the Great Dying\"?","a":"End-Permian extinction"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"What epoch are we living in?","a":"Holocene"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"Woolly mammoths lived during which time?","a":"The Ice Age"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"What is the oldest known piece of Earth, a crystal about 4.4 billion years old?","a":"Zircon"},{"category":"Earth & Natural History","subtopic":"Earth's History","q":"What is the informal name for the huge span of time before the Cambrian, covering most of Earth's history?","a":"Precambrian"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is the study of weather called?","a":"Meteorology"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What do we call a scientist who studies and forecasts weather?","a":"Meteorologist"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is the difference between weather and climate?","a":"Weather is short-term conditions; climate is the long-term average"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is a weather forecast?","a":"A prediction of future weather"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"On a weather map, what does \"H\" stand for?","a":"High pressure"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"On a weather map, what does \"L\" stand for?","a":"Low pressure"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What kind of weather does high pressure usually bring?","a":"Clear, fair weather"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What kind of weather does low pressure usually bring?","a":"Clouds, rain, or storms"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is humidity?","a":"The amount of water vapor in the air"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is the dew point?","a":"The temperature at which air becomes saturated and water vapor condenses"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is the boundary between two different air masses called?","a":"Front"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What do we call the front where cold air pushes under warm air?","a":"Cold front"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"Which type of front often brings light, steady rain over a wide area?","a":"Warm front"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What is an air mass?","a":"A large body of air with similar temperature and moisture"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What do weather satellites do?","a":"Take pictures and collect data about clouds and weather from space"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What does weather radar detect?","a":"Precipitation, such as rain and snow"},{"category":"Weather & Atmosphere","subtopic":"Meteorology","q":"What does NOAA stand for?","a":"National Oceanic and Atmospheric Administration"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"What are clouds made of?","a":"Tiny water droplets and ice crystals"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which cloud is puffy and white like cotton balls?","a":"Cumulus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which cloud forms flat, gray layers that can cover the whole sky?","a":"Stratus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which cloud is thin, wispy, and high in the sky?","a":"Cirrus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which tall, dark cloud produces thunderstorms?","a":"Cumulonimbus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"What does the word \"nimbus\" mean in cloud names?","a":"Rain"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"What is fog?","a":"A cloud at ground level"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which gray cloud type brings steady, widespread rain?","a":"Nimbostratus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"What does \"cumulus\" mean in Latin?","a":"Heap or pile"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"What are the white trails behind high-flying airplanes called?","a":"Contrails"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which cloud has an anvil-shaped top?","a":"Cumulonimbus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"How do clouds form?","a":"Warm, moist air rises, cools, and water vapor condenses"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Why don't clouds fall out of the sky?","a":"The droplets are tiny and light, and rising air holds them up"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which cloud type usually means fair weather?","a":"Cumulus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Clouds are classified by which two things?","a":"Shape and height"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"Which clouds are the highest: cirrus or stratus?","a":"Cirrus"},{"category":"Weather & Atmosphere","subtopic":"Clouds","q":"What do we call a low-lying, bumpy layer of gray or white clouds?","a":"Stratocumulus"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"Why do we have seasons?","a":"Earth's axis is tilted as it orbits the Sun"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"About how many degrees is Earth's axis tilted?","a":"23.5 degrees"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"In which month does the summer solstice occur in the Northern Hemisphere?","a":"June"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is an equinox?","a":"A day when day and night are about equal in length"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is the jet stream?","a":"A fast-moving river of air high in the atmosphere"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is El Niño?","a":"A warming of the Pacific Ocean's surface near the equator that changes weather worldwide"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is La Niña?","a":"A cooling of the Pacific Ocean's surface near the equator"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is a monsoon?","a":"A seasonal wind shift that brings heavy rains"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"In which direction do weather systems generally move across the United States?","a":"West to east"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is a rain shadow?","a":"A dry area on the sheltered side of a mountain"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What causes lake-effect snow?","a":"Cold air picking up moisture as it crosses warm lake water"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is a heat wave?","a":"A long period of unusually hot weather"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is sleet?","a":"Frozen raindrops (ice pellets)"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"What is freezing rain?","a":"Rain that freezes when it touches cold surfaces"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"Where does hail form?","a":"In thunderstorm clouds, as strong updrafts carry ice up again and again"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"Why is it colder at the top of a mountain?","a":"Air gets thinner and cooler with altitude"},{"category":"Weather & Atmosphere","subtopic":"Weather Patterns","q":"Why does a breeze blow from the sea toward land on a sunny day?","a":"Land heats faster, warm air rises, and cooler sea air moves in"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What is a hurricane?","a":"A huge rotating tropical storm with winds of at least 74 mph"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What is a hurricane called in the western Pacific Ocean?","a":"Typhoon"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"When is the Atlantic hurricane season?","a":"June 1 to November 30"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What do hurricanes form over?","a":"Warm ocean water"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"About how warm must the ocean be for hurricanes to form?","a":"At least about 80°F (26.5°C)"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What is the calm center of a hurricane called?","a":"Eye"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What is the ring of the strongest winds around the eye called?","a":"Eyewall"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What is a storm surge?","a":"A rise of seawater pushed onto land by a storm"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What scale rates hurricane strength?","a":"Saffir-Simpson scale"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"How strong are the winds of a Category 5 hurricane?","a":"157 mph or higher"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What wind speeds define a tropical storm?","a":"39 to 73 mph"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"Which way do hurricanes spin in the Northern Hemisphere?","a":"Counterclockwise"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What effect of Earth's rotation makes storms spin?","a":"Coriolis effect"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What organization maintains the lists of hurricane names?","a":"World Meteorological Organization"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What three things are needed for a thunderstorm?","a":"Moisture, unstable air, and lift"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"What do we call a strong winter storm along the U.S. East Coast?","a":"Nor'easter"},{"category":"Weather & Atmosphere","subtopic":"Storms & Hurricanes","q":"Which is more serious: a hurricane watch or a hurricane warning?","a":"Warning"},{"category":"Weather & Atmosphere","subtopic":"Tornadoes","q":"What is a tornado?","a":"A rotating column of air touching both the ground and a storm cloud"},{"category":"Weather & Atmosphere","subtopic":"Tornadoes","q":"What is a funnel cloud?","a":"A rotating cloud that has not reached the ground"},{"category":"Weather & Atmosphere","subtopic":"Tornadoes","q":"What scale rates tornado strength?","a":"Enhanced Fujita (EF) scale"},{"category":"Weather & Atmosphere","subtopic":"Tornadoes","q":"What is the range of the EF scale?","a":"EF0 t spark of static electricity"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"What causes thunder?","a":"Air rapidly heated and expanded by lightning"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"Why do you see lightning before you hear thunder?","a":"Light travels faster than sound"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"About how many seconds between flash and thunder equal one mile?","a":"About 5 seconds"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"About how hot is a lightning bolt?","a":"About 50,000°F, hotter than the Sun's surface"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"Who invented the lightning rod?","a":"Benjamin Franklin"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"Name a safe place during lightning.","a":"Inside a building or a hard-topped car"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"What is the rhyme for lightning safety?","a":"\"When thunder roars, go indoors\""},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"What is \"heat lightning\"?","a":"Lightning too far away for its thunder to be heard"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"What builds up inside storm clouds to make lightning?","a":"Electric charges, positive and negative"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"Name one type of lightning.","a":"Cloud-to-ground, cloud-to-cloud, or intracloud"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"What are glass tubes formed when lightning strikes sand called?","a":"Fulgurites"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"Can lightning strike the same place twice?","a":"Yes, especially tall objects"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q":"What is ball lightning?","a":"A rare glowing sphere sometimes reported during storms"},{"category":"Weather & Atmosphere","subtopic":"Lightning","q" ayer?","a":"Montreal Protocol"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"Name a renewable energy source.","a":"Solar, wind, hydro, geothermal"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"What is a carbon footprint?","a":"The amount of greenhouse gases produced by a person or activity"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"Why does deforestation add to climate change?","a":"Fewer trees are left to absorb carbon dioxide"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"What happens to corals when oceans get too warm?","a":"They bleach"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"What is ocean acidification?","a":"The ocean becoming more acidic as it absorbs carbon dioxide"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"Which Arctic animal is threatened by melting sea ice?","a":"Polar bear"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"What greenhouse gas do cows release?","a":"Methane"},{"category":"Weather & Atmosphere","subtopic":"Climate Change","q":"What agreement signed in 2015 aims to limit global warming?","a":"Paris Agreement"},{"category":"Weather & Atmosphere","subtopic":"Atmospheric Science","q":"What is the atmosphere?","a":"The layer of gases surrounding Earth"},{"category":"Weather & Atmosphere","subtopic":"Atmospheric Science","q":"What is the most abundant gas in the air?","a":"Nitrogen"},{"category":"Weather & Atmosphere","subtopic":"Atmospheric Science","q":"About what percent of the air is oxygen?","a":"About 21 percent"},{"category":"Weather & Atmosphere","subtopic":"Atmospheric Science","q":"What are the layers of the atmosphere from the ground up?","a":"Troposphere, stratosphere, mesosphere, thermosphere, exosphere"},{"category":"Weather & Atmosphere","subtopic":"Atmospheric Science","q":"In which layer does weather happen?","a":"Troposphere"},{"category":"Weather & Atmosphere ifferences in air pressure from uneven heating"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"A west wind blows from which direction?","a":"From the west"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"Which direction does a wind vane point?","a":"Into the wind (toward where the wind comes from)"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What instrument shows wind direction?","a":"Wind vane"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What instrument measures wind speed?","a":"Anemometer"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What scale describes wind force from calm to hurricane?","a":"Beaufort scale"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What are the steady winds that blow toward the equator called?","a":"Trade winds"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"Which direction do the prevailing westerlies blow across the U.S.?","a":"West to east"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What do airports use to show wind direction and strength?","a":"Windsock"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What wind blows from land to sea at night?","a":"Land breeze"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What is a chinook?","a":"A warm, dry wind on the eastern side of the Rocky Mountains"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What are the hot, dry Santa Ana winds?","a":"Strong winds in Southern California"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What machines turn wind into electricity?","a":"Wind turbines"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What is the area of calm winds near the equator called?","a":"Doldrums"},{"category":"Weather & Atmosphere","subtopic":"Wind","q":"What is wind chill?","a":"How cold it feels because of the wind"},{"category":"Weather & Atmosphere","subtopic":"Weather Instruments","q":"What does a thermometer measure?", t temperature scale?","a":"Daniel Gabriel Fahrenheit"},{"category":"Weather & Atmosphere","subtopic":"Weather Instruments","q":"The Celsius temperature scale is named for which scientist?","a":"Anders Celsius"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What is at the center of our solar system?","a":"The Sun"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"How many planets are in our solar system?","a":"Eight"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"List the planets in order from the Sun.","a":"Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What are the four rocky inner planets called?","a":"Terrestrial planets"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"Which two planets are gas giants?","a":"Jupiter and Saturn"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"Which two planets are ice giants?","a":"Uranus and Neptune"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"The asteroid belt lies between which two planets?","a":"Mars and Jupiter"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"Which former planet is now classified as a dwarf planet?","a":"Pluto"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"In what year was Pluto reclassified as a dwarf planet?","a":"2006"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What region beyond Neptune is filled with icy objects?","a":"Kuiper Belt"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What force keeps the planets in orbit around the Sun?","a":"Gravity"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What is an orbit?","a":"The path one object takes around another because of gravity"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What shape are the planets' orbits?","a":"Ellipses (ovals)"},{"category":"Space & Astronomy","subtopic":"The Solar System","q":"What galaxy is our solar system in?","a":"Milky Way"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is closest to the Sun?","a":"Mercury"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is the hottest?","a":"Venus"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Why is Venus hotter than Mercury?","a":"Its thick carbon dioxide atmosphere traps heat"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is called the Red Planet?","a":"Mars"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Why does Mars look red?","a":"Iron oxide (rust) on its surface"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is the largest?","a":"Jupiter"},{"category":"Space & Astronomy","subtopic":"Planets","q":"What is the Great Red Spot?","a":"A giant storm on Jupiter"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is famous for its bright rings?","a":"Saturn"},{"category":"Space & Astronomy","subtopic":"Planets","q":"What are Saturn's rings made of?","a":"Chunks of ice and rock"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet rotates on its side?","a":"Uranus"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is farthest from the Sun?","a":"Neptune"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet has the shortest year?","a":"Mercury (about 88 Earth days)"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet spins backward compared to most planets?","a":"Venus"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet has Olympus Mons, the tallest volcano in the solar system?","a":"Mars"},{"category":"Space & Astronomy","subtopic":"Planets","q":"Which planet is the only one known to have life?","a":"Earth"},{"category":"Space & Astronomy","subtopic":"Planets","q":"How long does Ear y Way?","a":"Andromeda"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"Name the three main shapes of galaxies.","a":"Spiral, elliptical, irregular"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"About how many stars are in the Milky Way?","a":"Hundreds of billions"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"Where is our solar system in the Milky Way?","a":"In one of the spiral arms"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"What is at the center of the Milky Way?","a":"A supermassive black hole"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"Which astronomer showed that Andromeda is a separate galaxy?","a":"Edwin Hubble"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"What is a group of galaxies held together by gravity called?","a":"Galaxy cluster"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"Why is our galaxy called the \"Milky\" Way?","a":"It looks like a milky band of stars across the night sky"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"What is dark matter?","a":"Invisible matter that we detect only through its gravity"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"About how far away is the Andromeda Galaxy?","a":"About 2.5 million light-years"},{"category":"Space & Astronomy","subtopic":"Galaxies","q":"What shape is an elliptical galaxy?","a":"Oval or ball-shaped"},{"category":"Space & Astronomy","subtopic":"Black Holes","q":"What is a black hole?","a":"A region where gravity is so strong that nothing, not even light, can escape"},{"category":"Space & Astronomy","subtopic":"Black Holes","q":"Why are black holes \"black\"?","a":"No light can escape from them"},{"category":"Space & Astronomy","subtopic":"Black Holes","q":"What is the boundary around a black hole called?","a":"Event horizon"},{"category":"Space & Astronomy","subtopic":"Black Holes","q":"How do many black holes form?","a":"When a massive star collapses"},{"category":" nergy?","a":"Energy of motion"},{"category":"Physics","subtopic":"Energy","q":"What is potential energy?","a":"Stored energy"},{"category":"Physics","subtopic":"Energy","q":"What does the law of conservation of energy say?","a":"Energy cannot be created or destroyed, only changed"},{"category":"Physics","subtopic":"Energy","q":"Name a source of chemical energy.","a":"Food, batteries, or fuel"},{"category":"Physics","subtopic":"Energy","q":"Where does a roller coaster have the most potential energy?","a":"At the top of the highest hill"},{"category":"Physics","subtopic":"Energy","q":"What is thermal energy?","a":"Heat energy from the motion of particles"},{"category":"Physics","subtopic":"Energy","q":"Name a renewable energy source.","a":"Solar, wind, hydro, or geothermal"},{"category":"Physics","subtopic":"Energy","q":"Name a nonrenewable energy source.","a":"Coal, oil, or natural gas"},{"category":"Physics","subtopic":"Energy","q":"What do solar panels do?","a":"Turn sunlight into electricity"},{"category":"Physics","subtopic":"Energy","q":"Which energy source uses moving water to make electricity?","a":"Hydroelectric power"},{"category":"Physics","subtopic":"Energy","q":"What energy change happens in a light bulb?","a":"Electrical energy becomes light and heat"},{"category":"Physics","subtopic":"Energy","q":"What energy change happens in a wind turbine?","a":"Kinetic energy of wind becomes electrical energy"},{"category":"Physics","subtopic":"Energy","q":"What is the main source of energy for Earth?","a":"The Sun"},{"category":"Physics","subtopic":"Electricity","q":"What is electric current?","a":"The flow of electric charge, usually electrons"},{"category":"Physics","subtopic":"Electricity","q":"What unit measures electric current?","a":"Ampere (amp)"},{"category":"Physics","subtopic":"Electricity","q":"What unit measures voltage?","a":"Volt"},{"category":"Physics","subtopic":"Electricity","q":"What unit measures resistance?","a":"Ohm"},{"category":"Physics","sub  a magnet where its force can be felt"},{"category":"Physics","subtopic":"Magnetism","q":"What does Earth act like?","a":"A giant magnet"},{"category":"Physics","subtopic":"Magnetism","q":"What does a compass needle point toward?","a":"Earth's magnetic north"},{"category":"Physics","subtopic":"Magnetism","q":"What is an electromagnet?","a":"A magnet made by running electric current through a coil of wire"},{"category":"Physics","subtopic":"Magnetism","q":"Which scientist discovered the link between electricity and magnetism in 1820?","a":"Hans Christian Oersted"},{"category":"Physics","subtopic":"Magnetism","q":"What is lodestone?","a":"A naturally magnetic rock (magnetite)"},{"category":"Physics","subtopic":"Magnetism","q":"If you cut a magnet in half, what do you get?","a":"Two smaller magnets, each with two poles"},{"category":"Physics","subtopic":"Magnetism","q":"What kind of train floats above the track using magnets?","a":"Maglev train"},{"category":"Physics","subtopic":"Magnetism","q":"Who invented the electric generator principle by moving a magnet through a coil?","a":"Michael Faraday"},{"category":"Physics","subtopic":"Magnetism","q":"Is aluminum attracted to a magnet?","a":"No"},{"category":"Physics","subtopic":"Light & Optics","q":"How fast does light travel?","a":"About 186,000 miles (300,000 km) per second"},{"category":"Physics","subtopic":"Light & Optics","q":"How does light travel?","a":"In straight lines"},{"category":"Physics","subtopic":"Light & Optics","q":"What is reflection?","a":"Light bouncing off a surface"},{"category":"Physics","subtopic":"Light & Optics","q":"What is refraction?","a":"The bending of light as it passes from one material to another"},{"category":"Physics","subtopic":"Light & Optics","q":"What are the colors of the visible spectrum in order?","a":"Red, orange, yellow, green, blue, indigo, violet"},{"category":"Physics","subtopic":"Light & Optics","q":"What does a prism do to white light?","a":"Splits it into colors"},{"cate "Hertz"},{"category":"Physics","subtopic":"Sound & Waves","q":"What is an echo?","a":"Sound that bounces off a surface and returns"},{"category":"Physics","subtopic":"Sound & Waves","q":"Does sound travel fastest through solids, liquids, or gases?","a":"Solids"},{"category":"Physics","subtopic":"Sound & Waves","q":"What are the highest and lowest points of a wave called?","a":"Crest and trough"},{"category":"Physics","subtopic":"Sound & Waves","q":"What is wavelength?","a":"The distance between two crests of a wave"},{"category":"Physics","subtopic":"Sound & Waves","q":"What is ultrasound?","a":"Sound waves too high for humans to hear, used in medical imaging"},{"category":"Physics","subtopic":"Sound & Waves","q":"What is the Doppler effect?","a":"A change in pitch caused by a moving sound source"},{"category":"Physics","subtopic":"Sound & Waves","q":"What does sonar use to find objects underwater?","a":"Sound waves"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What is heat?","a":"The transfer of thermal energy from a warmer object to a cooler one"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What are the three ways heat moves?","a":"Conduction, convection, radiation"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What is conduction?","a":"Heat transfer through direct contact"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What is convection?","a":"Heat transfer by the movement of fluids such as air or water"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What is radiation?","a":"Heat transfer by waves, like warmth from the Sun"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What does temperature measure?","a":"The average motion energy of the particles in a substance"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What is absolute zero?","a":"The lowest possible temperature, 0 Kelvin"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What temperature scale do scientists commonly use for absolute temperature?","a":"Kelvin"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"Name a good thermal insulator.","a":"Wool, foam, or air"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What happens to particles when a substance is heated?","a":"They move faster"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"What is thermal expansion?","a":"Materials getting bigger when heated"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"At what temperature does ice melt in Fahrenheit?","a":"32°F"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"In which direction does heat naturally flow?","a":"From hot to cold"},{"category":"Physics","subtopic":"Heat & Thermodynamics","q":"Why do metal spoons feel colder than wooden spoons at the same temperature?","a":"Metal conducts heat away from your hand faster"},{"category":"Physics","subtopic":"Pressure","q":"What is pressure?","a":"Force per unit area"},{"category":"Physics","subtopic":"Pressure","q":"What unit measures pressure?","a":"Pascal"},{"category":"Physics","subtopic":"Pressure","q":"Who is the pascal named after?","a":"Blaise Pascal"},{"category":"Physics","subtopic":"Pressure","q":"What is atmospheric pressure?","a":"The weight of the air pressing on everything"},{"category":"Physics","subtopic":"Pressure","q":"What happens to water pressure as you dive deeper?","a":"It increases"},{"category":"Physics","subtopic":"Pressure","q":"What instrument measures air pressure?","a":"Barometer"},{"category":"Physics","subtopic":"Pressure","q":"Why does a sharp knife cut better than a dull one?","a":"Force is focused on a smaller area, increasing pressure"},{"category":"Physics","subtopic":"Pressure","q":"Why do snowshoes help you walk on snow?","a":"They spread your weight over a larger area"},{"category":"Physics","subtopic":"Pressure","q":"What is a vacuum?","a":"A space with no matter"},{"category":"Physics","subtopic":"Pressure","q":"Why can you drink with a straw?","a":"Lower pressure inside the straw lets air pressure push the liquid up"},{"category":"Physics","subtopic":"Pressure","q":"What happens to the pressure of a gas if you squeeze it into a smaller space?","a":"It increases"},{"category":"Physics","subtopic":"Pressure","q":"Why are airplane cabins pressurized?","a":"Air is too thin at high altitudes"},{"category":"Physics","subtopic":"Pressure","q":"Why do your ears pop in a plane?","a":"Air pressure changes"},{"category":"Physics","subtopic":"Pressure","q":"What do hydraulic machines use to lift heavy objects?","a":"Pressure in a liquid"},{"category":"Physics","subtopic":"Simple Machines","q":"What is a simple machine?","a":"A device that makes work easier by changing the size or direction of a force"},{"category":"Physics","subtopic":"Simple Machines","q":"Name the six simple machines.","a":"Lever, pulley, wheel and axle, inclined plane, wedge, screw"},{"category":"Physics","subtopic":"Simple Machines","q":"Name an example of a lever.","a":"Seesaw, crowbar, or scissors"},{"category":"Physics","subtopic":"Simple Machines","q":"What is the pivot point of a lever called?","a":"Fulcrum"},{"category":"Physics","subtopic":"Simple Machines","q":"What is an inclined plane?","a":"A slanted surface, like a ramp"},{"category":"Physics","subtopic":"Simple Machines","q":"Which simple machine is an axe head?","a":"Wedge"},{"category":"Physics","subtopic":"Simple Machines","q":"A screw is an inclined plane wrapped around what?","a":"A cylinder"},{"category":"Physics","subtopic":"Simple Machines","q":"What simple machine uses a rope and a grooved wheel?","a":"Pulley"},{"category":"Physics","subtopic":"Simple Machines","q":"Which simple machine is a doorknob?","a":"Wheel and axle"},{"category":"Physics","subtopic":"Simple Machines","q":"How is work calculated?","a":"Force times distance"},{"category":"Physics","subtopic":"Simple Machines","q":"What unit measures work?","a":"Joule"},{"category":"Physics","subtopic":"Simple Machines","q":"What is mechanical advantage?","a":"How many times a machine multiplies the force you apply"},{"category":"Physics","subtopic":"Simple Machines","q":"What is a compound machine?","a":"A machine made of two or more simple machines"},{"category":"Physics","subtopic":"Simple Machines","q":"What is power?","a":"How fast work is done, measured in watts"},{"category":"Physics","subtopic":"Momentum","q":"What is momentum?","a":"Mass times velocity"},{"category":"Physics","subtopic":"Momentum","q":"A truck and a car move at the same speed. Which has more momentum?","a":"The truck"},{"category":"Physics","subtopic":"Momentum","q":"What does the law of conservation of momentum say?","a":"Total momentum stays the same if no outside forces act"},{"category":"Physics","subtopic":"Momentum","q":"What is the momentum of a stationary object?","a":"Zero"},{"category":"Physics","subtopic":"Momentum","q":"What is the momentum of a 2 kg ball moving at 5 m/s?","a":"10 kilogram-meters per second"},{"category":"Physics","subtopic":"Momentum","q":"What are the units of momentum?","a":"Kilogram-meters per second"},{"category":"Physics","subtopic":"Momentum","q":"Why do airbags protect people?","a":"They increase the time of a collision, reducing the force"},{"category":"Physics","subtopic":"Momentum","q":"What are crumple zones in cars designed to do?","a":"Absorb energy and lengthen the time of a crash"},{"category":"Physics","subtopic":"Momentum","q":"Why is it harder to stop a fast truck than a slow one?","a":"It has more momentum"},{"category":"Physics","subtopic":"Momentum","q":"What happens to the momentum of two billiard balls when they collide?","a":"Total momentum is conserved"},{"category":"Physics","subtopic":"Momentum","q":"Why does a rowboat move backward when you jump off the front?","a":"Momentum is conserved"},{"category":"Physics","subtopic":"Momentum","q":"How does a rocket move in space?","a":"By pushing exhaust gas backward"},{"category":"Physics","subtopic":"Momentum","q":"What is impulse?","a":"A force applied over a time, which changes momentum"},{"category":"Physics","subtopic":"Momentum","q":"If mass doubles and velocity stays the same, what happens to momentum?","a":"It doubles"},{"category":"Physics","subtopic":"Newton's Laws","q":"What is Newton's first law?","a":"An object stays at rest or in motion unless a force acts on it"},{"category":"Physics","subtopic":"Newton's Laws","q":"What is Newton's second law?","a":"Force equals mass times acceleration"},{"category":"Physics","subtopic":"Newton's Laws","q":"What is Newton's third law?","a":"For every action, there is an equal and opposite reaction"},{"category":"Physics","subtopic":"Newton's Laws","q":"Which law explains why you lurch forward when a car stops suddenly?","a":"First law (inertia)"},{"category":"Physics","subtopic":"Newton's Laws","q":"Which law explains why a full cart is harder to push than an empty one?","a":"Second law"},{"category":"Physics","subtopic":"Newton's Laws","q":"Which law explains how a rocket launches?","a":"Third law"},{"category":"Physics","subtopic":"Newton's Laws","q":"What book did Newton publish in 1687 describing the laws of motion?","a":"Principia"},{"category":"Physics","subtopic":"Newton's Laws","q":"What does \"a\" stand for in F = ma?","a":"Acceleration"},{"category":"Physics","subtopic":"Newton's Laws","q":"If force stays the same and mass doubles, what happens to acceleration?","a":"It is cut in half"},{"category":"Physics","subtopic":"Newton's Laws","q":"Which law explains why a tablecloth can be pulled out from under dishes?","a":"First law (inertia)"},{"category":"Physics","subtopic":"Newton's Laws","q":"When a swimmer pushes water backward, what moves her forward?","a":"The reaction force of the water (third law)"},{"category":"Physics","subtopic":"Newton's Laws","q":"If the net force on an object is zero, what does its velocity do?","a":"It stays constant"},{"category":"Physics","subtopic":"Newton's Laws","q":"What are Newton's three laws called together?","a":"The laws of motion"},{"category":"Physics","subtopic":"Newton's Laws","q":"What is the unit of force named after?","a":"Isaac Newton"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is in the nucleus of an atom?","a":"Protons and neutrons"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is nuclear fission?","a":"The splitting of a nucleus"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is nuclear fusion?","a":"The joining of nuclei"},{"category":"Physics","subtopic":"Nuclear Physics","q":"Which process powers the Sun?","a":"Fusion"},{"category":"Physics","subtopic":"Nuclear Physics","q":"Which process powers nuclear power plants?","a":"Fission"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is radioactivity?","a":"When unstable nuclei give off energy and particles"},{"category":"Physics","subtopic":"Nuclear Physics","q":"Who discovered radioactivity in 1896?","a":"Henri Becquerel"},{"category":"Physics","subtopic":"Nuclear Physics","q":"Which scientist won Nobel Prizes in both physics and chemistry for her radioactivity research?","a":"Marie Curie"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is a half-life?","a":"The time it takes for half of a radioactive sample to decay"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is carbon-14 used for?","a":"Dating ancient organic materials"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What is Einstein's famous equation relating energy and mass?","a":"E equals m c squared"},{"category":"Physics","subtopic":"Nuclear Physics","q":"What are isotopes?","a":"Atoms of the same element with different numbers of neutrons"},{"category":"Physics","subtopic":"Nuclear Physics","q":"Name the three main types of radiation from nuclei.","a":"Alpha, beta, and gamma"},{"category":"Physics","subtopic":"Nuclear Physics","q":"Which element is commonly used as nuclear reactor fuel?","a":"Uranium"},{"category":"Physics","subtopic":"Quantum Physics","q":"What does the word \"quantum\" refer to?","a":"The smallest possible amount of something"},{"category":"Physics","subtopic":"Quantum Physics","q":"What is a photon?","a":"A particle (packet) of light"},{"category":"Physics","subtopic":"Quantum Physics","q":"Which physicist started quantum theory in 1900?","a":"Max Planck"},{"category":"Physics","subtopic":"Quantum Physics","q":"Einstein won his Nobel Prize for explaining which effect?","a":"Photoelectric effect"},{"category":"Physics","subtopic":"Quantum Physics","q":"In an atom, electrons are found in what?","a":"Energy levels (shells)"},{"category":"Physics","subtopic":"Quantum Physics","q":"What is wave-particle duality?","a":"Light and tiny particles can act like both waves and particles"},{"category":"Physics","subtopic":"Quantum Physics","q":"What does the Heisenberg uncertainty principle say?","a":"You can't know both a particle's exact position and motion at the same time"},{"category":"Physics","subtopic":"Quantum Physics","q":"Which physicist is famous for a thought experiment about a cat in a box?","a":"Erwin Schrödinger"},{"category":"Physics","subtopic":"Quantum Physics","q":"Which physicist created a famous model of the atom with electron orbits?","a":"Niels Bohr"},{"category":"Physics","subtopic":"Quantum Physics","q":"What do quantum computers use instead of regular bits?","a":"Qubits"},{"category":"Physics","subtopic":"Quantum Physics","q":"What is quantum tunneling?","a":"When a particle passes through a barrier it normally couldn't cross"},{"category":"Physics","subtopic":"Quantum Physics","q":"What charge does an electron have?","a":"Negative"},{"category":"Physics","subtopic":"Quantum Physics","q":"What is superposition?","a":"Being in several possible states at once until measured"},{"category":"Physics","subtopic":"Quantum Physics","q":"Name a modern technology that relies on quantum physics.","a":"Lasers, transistors (computer chips), or MRI machines"},{"category":"Chemistry","subtopic":"Elements","q":"What is an element?","a":"A pure substance made of only one kind of atom"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for gold?","a":"Au"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for silver?","a":"Ag"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for iron?","a":"Fe"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for sodium?","a":"Na"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for potassium?","a":"K"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for lead?","a":"Pb"},{"category":"Chemistry","subtopic":"Elements","q":"What is the chemical symbol for oxygen?","a":"O"},{"category":"Chemistry","subtopic":"Elements","q":"What is the most abundant element in the universe?","a":"Hydrogen"},{"category":"Chemistry","subtopic":"Elements","q":"What is the most abundant element in Earth's crust?","a":"Oxygen"},{"category":"Chemistry","subtopic":"Elements","q":"What is the most abundant gas in Earth's atmosphere?","a":"Nitrogen"},{"category":"Chemistry","subtopic":"Elements","q":"Which metal is a liquid at room temperature?","a":"Mercury"},{"category":"Chemistry","subtopic":"Elements","q":"What is the lightest element?","a":"Hydrogen"},{"category":"Chemistry","subtopic":"Elements","q":"Which element is the backbone of all living things?","a":"Carbon"},{"category":"Chemistry","subtopic":"Elements","q":"Which noble gas is used to fill party balloons so they float?","a":"Helium"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"Who created the first widely accepted periodic table?","a":"Dmitri Mendeleev"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What are the horizontal rows of the periodic table called?","a":"Periods"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What are the vertical columns called?","a":"Groups (families)"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"How are elements arranged in the modern periodic table?","a":"By atomic number"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What does the atomic number tell you?","a":"The number of protons in an atom"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What group contains the noble gases?","a":"Group 18"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What are the elements in Group 1 (except hydrogen) called?","a":"Alkali metals"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What are the elements in Group 17 called?","a":"Halogens"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"How many elements are known?","a":"118"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What is the most reactive nonmetal?","a":"Fluorine"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"Name a metalloid.","a":"Silicon, boron, or germanium"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"Which element has the symbol He?","a":"Helium"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What is the atomic number of carbon?","a":"6"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"What is the atomic number of hydrogen?","a":"1"},{"category":"Chemistry","subtopic":"The Periodic Table","q":"Why is it called the \"periodic\" table?","a":"Element properties repeat in a regular pattern"},{"category":"Chemistry","subtopic":"Atoms","q":"What is an atom?","a":"The smallest unit of an element that keeps its properties"},{"category":"Chemistry","subtopic":"Atoms","q":"What are the three particles inside an atom?","a":"Protons, neutrons, and electrons"},{"category":"Chemistry","subtopic":"Atoms","q":"Which particle has a positive charge?","a":"Proton"},{"category":"Chemistry","subtopic":"Atoms","q":"Which particle has a negative charge?","a":"Electron"},{"category":"Chemistry","subtopic":"Atoms","q":"Which particle has no charge?","a":"Neutron"},{"category":"Chemistry","subtopic":"Atoms","q":"Where are protons and neutrons found?","a":"In the nucleus"},{"category":"Chemistry","subtopic":"Atoms","q":"Where are electrons found?","a":"In shells (an electron cloud) around the nucleus"},{"category":"Chemistry","subtopic":"Atoms","q":"Who proposed the modern atomic theory in 1803?","a":"John Dalton"},{"category":"Chemistry","subtopic":"Atoms","q":"Who discovered the electron?","a":"J.J. Thomson"},{"category":"Chemistry","subtopic":"Atoms","q":"Who discovered the atomic nucleus?","a":"Ernest Rutherford"},{"category":"Chemistry","subtopic":"Atoms","q":"What is the mass number?","a":"The number of protons plus neutrons"},{"category":"Chemistry","subtopic":"Atoms","q":"What is an ion?","a":"An atom that has gained or lost electrons and has a charge"},{"category":"Chemistry","subtopic":"Atoms","q":"What makes up most of the volume of an atom?","a":"Empty space"},{"category":"Chemistry","subtopic":"Atoms","q":"Which ancient Greek philosopher first proposed the idea of atoms?","a":"Democritus"},{"category":"Chemistry","subtopic":"Atoms","q":"What does the Greek word \"atomos\" mean?","a":"Uncuttable (indivisible)"},{"category":"Chemistry","subtopic":"Molecules","q":"What is a molecule?","a":"Two or more atoms bonded together"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the chemical formula for water?","a":"H2O"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the chemical formula for carbon dioxide?","a":"CO2"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the chemical formula for table salt?","a":"NaCl"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the formula for oxygen gas?","a":"O2"},{"category":"Chemistry","subtopic":"Molecules","q":"What is a compound?","a":"A substance made of two or more different elements chemically combined"},{"category":"Chemistry","subtopic":"Molecules","q":"What does a chemical formula tell you?","a":"Which elements are in a substance and how many atoms of each"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the formula for ozone?","a":"O3"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the formula for methane?","a":"CH4"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the formula for glucose?","a":"C6H12O6"},{"category":"Chemistry","subtopic":"Molecules","q":"Name a diatomic molecule.","a":"H2, O2, N2, or Cl2"},{"category":"Chemistry","subtopic":"Molecules","q":"Is water an element or a compound?","a":"Compound"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the formula for hydrogen peroxide?","a":"H2O2"},{"category":"Chemistry","subtopic":"Molecules","q":"What is the formula for ammonia?","a":"NH3"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What is a chemical reaction?","a":"A process in which substances change into new substances"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What are the starting substances in a reaction called?","a":"Reactants"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What are the new substances formed called?","a":"Products"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"Name two signs that a chemical reaction has happened.","a":"Color change, gas bubbles, a solid forming, heat or light"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What does the law of conservation of mass say?","a":"Matter is not created or destroyed in a chemical reaction"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What is an exothermic reaction?","a":"A reaction that releases heat"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What is an endothermic reaction?","a":"A reaction that absorbs heat"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What is a catalyst?","a":"A substance that speeds up a reaction without being used up"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What chemical reaction turns iron orange and flaky?","a":"Rusting (oxidation)"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What is combustion?","a":"Burning a substance with oxygen"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What are the products of photosynthesis?","a":"Glucose and oxygen"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What gas is made when baking soda and vinegar react?","a":"Carbon dioxide"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What is a precipitate?","a":"A solid that forms in a liquid during a reaction"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"What does a balanced chemical equation show?","a":"The same number of each type of atom on both sides"},{"category":"Chemistry","subtopic":"Chemical Reactions","q":"Is melting ice a chemical or physical change?","a":"Physical change"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What do acids taste like?","a":"Sour (never taste chemicals in a lab)"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What are bases like to the touch?","a":"Slippery (and they taste bitter)"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"Name a common acid in food.","a":"Lemon juice, vinegar, or citric acid"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"Name a common base.","a":"Baking soda, soap, or ammonia"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What is an indicator?","a":"A substance that changes color to show if something is an acid or a base"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What happens to blue litmus paper in an acid?","a":"It turns red"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What acid is found in your stomach?","a":"Hydrochloric acid"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What acid gives vinegar its sour taste?","a":"Acetic acid"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What is neutralization?","a":"An acid and a base reacting to form water and a salt"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"Why do antacids help an upset stomach?","a":"They are bases that neutralize stomach acid"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"Name a strong acid.","a":"Sulfuric acid or hydrochloric acid"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"Which acid is found in oranges and lemons?","a":"Citric acid"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What is the common name for the base sodium hydroxide?","a":"Lye (caustic soda)"},{"category":"Chemistry","subtopic":"Acids & Bases","q":"What gases mainly cause acid rain?","a":"Sulfur dioxide and nitrogen oxides"},{"category":"Chemistry","subtopic":"States of Matter","q":"What are the three common states of matter?","a":"Solid, liquid, gas"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is the fourth state of matter?","a":"Plasma"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is melting?","a":"A solid changing into a liquid"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is freezing?","a":"A liquid changing into a solid"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is evaporation?","a":"A liquid changing into a gas"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is condensation?","a":"A gas changing into a liquid"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is sublimation?","a":"A solid changing directly into a gas"},{"category":"Chemistry","subtopic":"States of Matter","q":"What is deposition?","a":"A gas changing directly into a solid"},{"category":"Chemistry","subtopic":"States of Matter","q":"How do gas particles behave?","a":"They move fast and spread out to fill their container"},{"category":"Chemistry","subtopic":"Stat h"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"Whose experiment with jars of meat disproved the idea that maggots form from nothing?","a":"Francesco Redi"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"Whose cowpox experiment led to the first vaccine?","a":"Edward Jenner"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"Whose experiments with frog legs showed that electricity affects muscles?","a":"Luigi Galvani"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"Which ancient scientist is said to have shouted \"Eureka!\" after noticing water displacement?","a":"Archimedes"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"Whose paddle-wheel experiment showed a link between work and heat?","a":"James Prescott Joule"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"In 1919, an eclipse expedition led by Arthur Eddington helped confirm whose theory?","a":"Einstein's general relativity"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"Galileo rolled balls down ramps to study what?","a":"Motion and acceleration"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"What did the Wright brothers build to test wing shapes?","a":"A wind tunnel"},{"category":"Scientific Knowledge","subtopic":"Famous Experiments","q":"How did Alexander Fleming discover penicillin?","a":"Mold contaminated a bacteria dish and killed the bacteria"}];

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const MISSED_KEY = "sciencebee.missed";

const categories = [...new Set(DATA.map(q => q.category))];
const selected = new Set();
const opts = { order:"mix", score:true, seconds:0, count:-5 };

/* ---------- menu ---------- */
function renderCats(){
  const box = $("cats"); box.innerHTML = "";
  categories.forEach(c => {
    const n = DATA.filter(q => q.category === c).length;
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", selected.has(c));
    b.innerHTML = c.replace(/&/g,"&amp;") + "<small>" + n + "</small>";
    b.onclick = () => { selected.has(c) ? selected.delete(c) : selected.add(c); renderCats(); };
    box.appendChild(b);
  });
}
function seg(id, choices, key){
  const box = $(id); box.innerHTML = "";
  choices.forEach(([label,val]) => {
    const b = document.createElement("button");
    b.textContent = label; b.setAttribute("aria-pressed", opts[key] === val);
    b.onclick = () => { opts[key] = val; seg(id, choices, key); };
    box.appendChild(b);
  });
}
function renderMenu(){
  renderCats();
  seg("seg-order", [["Mixed up","mix"],["Topic by topic","topic"],["Original order","seq"]], "order");
  seg("seg-score", [["On",true],["Off",false]], "score");
  seg("seg-time", [["Off",0],["10s",10],["15s",15],["20s",20],["30s",30]], "seconds");
  seg("seg-count", [["5 per topic",-5],["10",10],["20",20],["50",50],["All",0]], "count");
  const missed = store.get(MISSED_KEY) || [];
  $("review").hidden = $("clear-missed").hidden = !missed.length;
  $("review").textContent = "Review " + missed.length + " missed";
}

/* ---------- quiz ---------- */
let deck=[], i=0, state="q", right=0, missed=[], timerId=null, remaining=0;

function shuffle(a){ for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }
function show(id){ ["menu","quiz","done"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0,0); }

function begin(list){
  deck = list.slice(); i = 0; right = 0; missed = [];
  show("quiz"); showQuestion();
}
function startFromMenu(){
  let list = DATA.filter(q => !selected.size || selected.has(q.category));
  if (opts.count === -5){
    const picked = [];
    categories.forEach(c => {
      const g = shuffle(list.filter(q => q.category === c)).slice(0, 5);
      picked.push(...g);
    });
    list = picked;
  } else if (opts.count > 0 && opts.count < list.length){
    list = shuffle(list.slice()).slice(0, opts.count);
  }
  if (opts.order === "mix") shuffle(list);
  else if (opts.order === "topic"){
    const g = [];
    categories.forEach(c => g.push(...shuffle(list.filter(q => q.category === c))));
    list = g;
  } else list.sort((a, b) => DATA.indexOf(a) - DATA.indexOf(b));
  begin(list);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function showQuestion(){
  stopTimer();
  const q = deck[i]; state = "q";
  $("meta").textContent = q.category + " \u203A " + q.subtopic + "  \u2022  " + (i+1) + " of " + deck.length;
  $("prog").style.width = (i / deck.length * 100) + "%";
  $("qtext").textContent = q.q;
  $("answer").textContent = ""; $("answer").classList.remove("show");
  $("hint").textContent = "Tap anywhere to show the answer";
  $("score-btns").hidden = true; $("timer").textContent = "";
  if (opts.seconds){
    remaining = opts.seconds; $("timer").textContent = remaining;
    timerId = setInterval(() => {
      remaining--; $("timer").textContent = remaining > 0 ? remaining : "Time!";
      if (remaining <= 0){ reveal(); }
    }, 1000);
  }
}
function reveal(){
  if (state !== "q") return;
  stopTimer(); state = "a";
  $("answer").textContent = deck[i].a; $("answer").classList.add("show");
  if (opts.score){ $("score-btns").hidden = false; $("hint").textContent = "Did you get it?"; }
  else { $("hint").textContent = "Tap anywhere for the next question"; }
}
function nextQuestion(){
  i++;
  if (i >= deck.length) finish(); else showQuestion();
}
function mark(got){
  if (state !== "a" || !opts.score) return;
  if (got) right++; else missed.push(deck[i]);
  nextQuestion();
}
function advance(){
  if (state === "q") reveal();
  else if (state === "a" && !opts.score) nextQuestion();
}
function finish(){
  stopTimer(); $("prog").style.width = "100%";
  const total = deck.length;
  if (opts.score){
    $("result").textContent = right + " out of " + total + " correct (" + Math.round(100*right/total) + "%)";
    store.set(MISSED_KEY, missed);
    $("saved").textContent = missed.length ? missed.length + " missed question(s) saved on this device." : "No missed questions. Perfect round!";
    $("redo").hidden = !missed.length;
  } else {
    $("result").textContent = "You went through " + total + " questions.";
    $("saved").textContent = ""; $("redo").hidden = true;
  }
  show("done");
}

/* ---------- events ---------- */
$("start").onclick = startFromMenu;
$("review").onclick = () => begin(shuffle((store.get(MISSED_KEY) || []).slice()));
$("clear-missed").onclick = () => { store.set(MISSED_KEY, []); renderMenu(); };
$("menu-btn").onclick = (e) => { e.stopPropagation(); stopTimer(); renderMenu(); show("menu"); };
$("home").onclick = () => { renderMenu(); show("menu"); };
$("redo").onclick = () => begin(missed.slice());
$("got").onclick = (e) => { e.stopPropagation(); mark(true); };
$("miss").onclick = (e) => { e.stopPropagation(); mark(false); };
$("quiz").addEventListener("click", e => { if (!e.target.closest("button")) advance(); });
document.addEventListener("keydown", e => {
  if ($("quiz").hidden) return;
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight"){ e.preventDefault(); advance(); }
  else if (e.key === "g" || e.key === "G") mark(true);
  else if (e.key === "m" || e.key === "M") mark(false);
  else if (e.key === "Escape"){ stopTimer(); renderMenu(); show("menu"); }
});

renderMenu();
</script>
