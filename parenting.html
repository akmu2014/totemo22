<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="A small pause in the noise.">
  <title>Parenting — Monument Vibe</title>
  <style>
    :root {
      --ink: #111110;
      --paper: #e8e4dc;
      --muted: #8e8980;
      --accent: #b89b70;
      --line: rgba(232, 228, 220, .17);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--ink); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 50% 43%, rgba(112, 94, 69, .18), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.035), transparent 55%),
        linear-gradient(145deg, #171715 0%, #10100f 48%, #090909 100%);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* A quiet grain gives the dark field a tactile, cinematic surface. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: clamp(26px, 5vw, 62px) clamp(24px, 7vw, 96px) 28px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: var(--paper);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .section {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    main {
      width: min(100%, 1080px);
      margin: auto;
      padding: 12vh 0 13vh;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(30px, 5vw, 58px);
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
      opacity: .65;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(48px, 8.4vw, 112px);
      line-height: .99;
      letter-spacing: -.055em;
      text-wrap: balance;
    }

    h1 .first-line { display: block; }

    .answer {
      margin: clamp(25px, 4vw, 46px) 0 0;
      color: #c9b18f;
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(29px, 5.2vw, 64px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .ornament {
      width: 1px;
      height: 68px;
      margin: clamp(42px, 7vw, 78px) auto 0;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      opacity: .75;
    }

    .whisper {
      margin: 25px 0 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      line-height: 1.8;
      text-transform: uppercase;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: #77736d;
      font-size: 9px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    footer a {
      color: inherit;
      text-decoration: none;
      transition: color .25s ease;
    }

    footer a:hover { color: var(--paper); }

    .index { color: var(--accent); opacity: .85; }

    @media (max-width: 560px) {
      .page { padding: 24px 22px 20px; }
      main { padding: 16vh 0 17vh; }
      .eyebrow { letter-spacing: .22em; gap: 9px; }
      .eyebrow::before, .eyebrow::after { width: 20px; }
      footer { font-size: 8px; letter-spacing: .12em; }
    }

    @media (prefers-reduced-motion: no-preference) {
      main > * {
        animation: arrive 1.15s both;
      }
      .eyebrow { animation-delay: .08s; }
      h1 { animation-delay: .22s; }
      .answer { animation-delay: .48s; }
      .ornament { animation-delay: .72s; }
      .whisper { animation-delay: .82s; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(13px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/">Monument Vibe</a>
      <span class="section">Notes / Parenting</span>
    </header>

    <main>
      <div class="eyebrow">A gentle disclaimer</div>
      <h1><span class="first-line">Oh, you want</span> advice?</h1>
      <p class="answer">Ask God. Not me.</p>
      <div class="ornament" aria-hidden="true"></div>
      <p class="whisper">I'm only human. So are you.</p>
    </main>

    <footer>
      <span class="index">MV&nbsp; / &nbsp;∞</span>
      <a href="/">Back to the beginning</a>
      <span>© Monument Vibe</span>
    </footer>
  </div>
</body>
</html>
