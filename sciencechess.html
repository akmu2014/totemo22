<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Science Chess</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#14213d; --bg2:#1f4e79; --card:#ffffff14; --line:#ffffff26;
  --text:#fff; --muted:#cdd8ec; --accent:#ffcf3f; --accent-dark:#b88a00;
  --good:#3ddc84; --bad:#ff5a6e;
  --light:#f0d9b5; --dark:#b58863;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Fredoka',system-ui,-apple-system,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:520px;margin:0 auto;padding:12px 14px 40px}
h1{margin:.2em 0;text-align:center;color:var(--accent);font-size:2.2rem;text-shadow:0 3px 0 #0006}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.icon-btn{background:#00000040;border:0;color:#fff;border-radius:99px;padding:7px 12px;font:inherit;cursor:pointer}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.95rem}
.pl.on{border-color:var(--accent);box-shadow:0 0 0 2px #ffcf3f55}
.pl b{display:block}
.pl small{color:var(--muted)}
.caps{height:2.6em;overflow:hidden;font-size:.9rem;letter-spacing:-2px;line-height:1.3em}
.status{text-align:center;font-weight:700;font-size:1.05rem;margin:0;line-height:1.3em}
.statusbox{height:4em;display:flex;flex-direction:column;justify-content:center;margin:4px 0;overflow:hidden}
.qwrap{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  max-height:78vh;overflow-y:auto;background:linear-gradient(transparent,#000a 18px);display:flex;justify-content:center}
.qwrap .qcard{width:100%;max-width:496px;margin:8px 0 0;box-shadow:0 -6px 30px #0007}
.below{min-height:140px}
.status.check{color:var(--bad)}
.crow{display:flex;gap:6px;align-items:stretch}
.crow .choice{flex:1;min-width:0}
.say{flex:0 0 44px;margin:7px 0;border-radius:12px;border:2px solid #d5deec;background:#eef3fb;color:#14213d;font-size:1.15rem;cursor:pointer}
.say:active{transform:scale(.95)}
.say.on{background:var(--accent);border-color:var(--accent)}
.letter{display:inline-block;width:1.5em;font-weight:700;opacity:.6}
.listen{background:#eef3fb;border-radius:12px;padding:12px;margin:8px 0;text-align:center;font-weight:600}
.qtools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.qtools button,.whysay{background:#14213d;color:#fff;border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qhead .q{flex:1}
.whysay{padding:4px 10px;font-size:.8rem;margin-top:6px}
.ansbox{background:#fff7d6;border:2px solid #ffcf3f;border-radius:12px;padding:12px;margin:8px 0;font-size:1.05rem}
.ansbox small{color:#5a6478}
.grade{display:flex;gap:8px}.grade .btn{margin:6px 0 2px}
.btn.good{background:var(--good);color:#073b20;box-shadow:0 5px 0 #1f9a57}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 #b8384a}
.hint{text-align:center;color:#5a6478;font-size:.9rem;margin:4px 0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9;background:#14213d;color:#fff;border:2px solid var(--accent);
  border-radius:14px;padding:10px 16px;font-weight:600;box-shadow:0 6px 24px #0008;max-width:92vw;text-align:center;animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}}
.savecard{border-color:var(--accent)}
.row2{display:flex;gap:8px}.row2 .btn{font-size:.95rem;padding:11px 8px;margin:6px 0 2px}
.top .icon-btn{padding:6px 9px;font-size:.85rem;white-space:nowrap}
.top>span:last-child{display:flex;gap:4px;flex-shrink:0}
.top .ttl{font-weight:700;font-size:1.05rem;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:400px){ .top .ttl .long{display:none} }
.qcard{background:#ffffffee;color:#14213d;border-radius:18px;padding:14px;margin:8px 0}
.tag{display:inline-block;background:#1f4e79;color:#fff;font-size:.8rem;border-radius:99px;padding:3px 10px}
.q{font-size:1.15rem;font-weight:600;margin:8px 0}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:7px 0;border-radius:12px;border:2px solid #d5deec;
  background:#fff;color:#14213d;font:inherit;font-size:1.02rem;cursor:pointer}
.choice.right{background:var(--good);border-color:var(--good);color:#073b20;font-weight:700}
.choice.wrong{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.choice.dim{opacity:.5}
.why{border-radius:12px;padding:10px 12px;margin-top:6px}
.why.good{background:#dcfbe9}.why.bad{background:#ffe1e5}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:0;font:inherit;font-size:1.1rem;font-weight:700;
  background:var(--accent);color:#2a1a00;box-shadow:0 5px 0 var(--accent-dark);margin:10px 0 4px;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.alt{background:#ffffff22;color:#fff;box-shadow:0 5px 0 #0005}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:auto;width:100%;
  border:4px solid #3b2a1a;border-radius:0;position:relative;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
  aspect-ratio:1/1;min-width:0;min-height:0;overflow:hidden}
@supports not (aspect-ratio:1/1){ .sq{height:0;padding-bottom:100%} .sq>*{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)} }
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last.l{background:#f6eb72}.sq.last.d{background:#dcc34b}
.sq.sel{box-shadow:inset 0 0 0 4px #2f80ed}
.sq.chk{background:radial-gradient(circle,#ff3b3b 0%,#ff3b3b88 45%,transparent 75%)}
.pc{font-size:min(9vw,46px);line-height:1;pointer-events:none;display:inline-block;text-align:center}
.sq .pc{display:block}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 2px 2px #0008}
.pc.b{color:#1a1a1a;text-shadow:0 0 2px #fff8}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:#0000004d;pointer-events:none}
.ring{position:absolute;inset:6%;border-radius:50%;border:5px solid #0000004d;pointer-events:none}
.coord{position:absolute;font-size:.6rem;font-weight:700;opacity:.7;pointer-events:none}
.coord.f{right:3px;bottom:1px}.coord.r{left:3px;top:1px}
.sq.l .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.locked .sq{cursor:default}
.locked::after{content:"";position:absolute;inset:0;background:#0000002a}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.mbox{background:#fff;color:#14213d;border-radius:18px;padding:18px;text-align:center;max-width:360px;width:100%}
.promo{display:flex;justify-content:space-around;margin-top:10px}
.promo button{font-size:2.6rem;background:#f0d9b5;border:0;border-radius:12px;width:62px;height:62px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;line-height:1.45}
.muted{color:var(--muted)}
.segs{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.seg{flex:1;min-width:90px;padding:11px 8px;border-radius:12px;border:2px solid var(--line);background:#00000030;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.seg.on{background:var(--accent);color:#2a1a00;border-color:var(--accent)}
.center{text-align:center}
</style>
</head>

 ["Grades 2–4 Practice", "An energy pyramid uses these positions to show how food energy moves through an ecosystem. Plants usually occupy the first position, plant-eaters the second, and animals that eat those plant-eaters the third. For the point, name these feeding levels in a food chain, whose first word begins with “troph.”", "Trophic levels", "accept feeding levels"],
 ["Grades 2–4 Practice", "Scientists rate these storms by looking at the damage their winds cause. They can grow beneath powerful storm clouds and send dust and other objects spinning through the air. For the point, name these rotating columns of air that touch the ground, often look like funnels, and are also called twisters.", "Tornadoes", "accept twisters"],
 ["Grades 2–4 Practice", "Almost all of an atom's mass is packed into this tiny part. Electrons are found outside it, and it usually contains protons and neutrons. For the point, name this dense center of an atom, which shares its name with the control center of a cell.", "Atomic nucleus", "accept nucleus"],

 ["Grades 2–4 Practice", "This property stays the same when an object moves from Earth to the Moon. Objects with more of it are harder to speed up or slow down, and it differs from weight. For the point, name the amount of matter in an object, measured in grams or kilograms.", "Mass", "do not accept weight"],
 ["Grades 2–4 Practice", "These animals had hard outer coverings divided into three lengthwise lobes. They lived in ancient oceans, and many could curl up like pill bugs. For the point, name these extinct sea animals often found as segmented fossils, whose name begins with “tri.”", "Trilobites", "accept trilobite"],
 ["Grades 2–4 Practice", "Water molecules arrange in six-sided patterns as crystals of this material grow. Its crystals form in cold clouds and can stick together into larger flakes. For the point, name this frozen precipitation that falls in white flakes and can be used to build a snowman.", "Snow", ""],
 ["Grades 2–4 Practice", "The number of these particles tells scientists which element an atom belongs to. They sit in the atom's center with neutrons, and their electric charge is opposite to an electron's. For the point, name these positively charged particles in an atom's nucleus.", "Proton", ""],
 ["Grades 2–4 Practice", "This organ has sections that travel up, across, and down inside your belly. It takes water out of leftover food and helps turn the remains into solid waste. For the point, name this main part of the large intestine whose five-letter name begins with C.", "Colon", "prompt on large intestine by asking “What part of the large intestine?”"],
 ["Grades 2–4 Practice", "Deep inside Earth, great heat and pressure can turn carbon into this crystal. It scratches other minerals and is also used on tools that cut hard materials. For the point, name this hardest natural mineral, a sparkling gem often set in rings.", "Diamond", ""],
 ["Grades 2–4 Practice", "Water does this at a lower temperature on a high mountain than at sea level. During it, bubbles of water vapor form throughout the liquid and rise to the surface. For the point, name what water does when heated to about 100 degrees Celsius at sea level, bubbling in a pot.", "Boiling", "prompt on vaporization by asking “What type?”"],
 ["Grades 2–4 Practice", "This body framework stores minerals such as calcium. It protects organs and works with muscles to help you move. For the point, name the framework made of all your bones, including your skull, ribs, and backbone.", "Skeleton", "accept skeletal system"],

 ["Grades 2–4 Practice", "Scientists think some comets begin their long trips toward the Sun in this region. It is a huge, distant shell of icy objects far beyond the planets and the Kuiper Belt. For the point, name this proposed cloud of comets named after astronomer Jan Oort.", "Oort cloud", ""],
 ["Grades 2–4 Practice", "This dinosaur's name means “tyrant lizard king.” It hunted on two powerful back legs and had huge jaws but very small arms. For the point, name this famous meat-eating dinosaur often called T. rex.", "Tyrannosaurus rex", "accept T. rex"],
 ["Grades 2–4 Practice", "Refineries separate this material into parts that have different boiling temperatures. It comes from underground and is used to make gasoline, diesel fuel, and many plastics. For the point, name this liquid fossil fuel also called crude oil.", "Petroleum", "accept crude oil or oil"],
 ["Grades 2–4 Practice", "Marine iguanas that swim for food live naturally on these islands. Giant tortoises and birds called Darwin's finches also live on this island group belonging to Ecuador. For the point, name these Pacific islands famous for Charles Darwin's visit and their unusual animals.", "Galápagos Islands", "accept Galápagos"],
 ["Grades 2–4 Practice", "The cells in this plant tissue form tubes that move dissolved sugar. It carries food made in leaves to growing parts and storage areas, including roots and fruits. For the point, name this sugar-carrying tissue, the partner of water-carrying xylem, whose name rhymes with “foam.”", "Phloem", ""],
 ["Grades 2–4 Practice", "A star called Sirius B is an example of this object. It can pack about the Sun's mass into something about Earth's size and slowly cools as it ages. For the point, name this small, dense leftover center of a Sun-like star, whose name combines a color with a word meaning very small.", "White dwarf", ""],
 ["Grades 2–4 Practice", "Differences between warm and cold air help create these fast-moving bands of wind. They usually blow from west to east high above the ground and help move weather systems. For the point, name these high-speed air currents that airplanes can ride to make a trip faster.", "Jet streams", ""],
 ["Grades 2–4 Practice", "Changes in a cell's instructions can lead to this group of diseases. Cells grow out of control, and some can form harmful lumps or spread to other parts of the body. For the point, name this group of diseases often treated with surgery, chemotherapy, or radiation.", "Cancer", ""],
 ["Grades 2–4 Practice", "A strong smell is added to this fuel to help people notice leaks. It comes from underground, is mostly methane, and often travels through pipelines to buildings. For the point, name this gas fuel used in many kitchen stoves and home heaters.", "Natural gas", "prompt on methane by asking “What fuel mixture consists primarily of methane?”"],
 ["Grades 2–4 Practice", "Cutting a bar-shaped example in half gives two smaller ones, each with two poles. These objects can pull on iron, and matching poles push away from each other. For the point, name an object with north and south poles, often used to hold a note on a refrigerator.", "Magnet", "accept permanent magnet"],
 ["Grades 2–4 Practice", "Tiny, fingerlike bumps line this organ and help it take nutrients out of food. It is a long, coiled tube where much of digestion and nutrient absorption happens. For the point, name this digestive organ that comes after the stomach and before the large intestine.", "Small intestine", ""],
 ["Grades 2–4 Practice", "Chemicals once used in some sprays and refrigerators damaged this part of the atmosphere. It is high above most clouds and contains a gas made of three oxygen atoms. For the point, name this protective layer that blocks much of the Sun's harmful ultraviolet light.", "Ozone layer", ""],
 ["Grades 2–4 Practice", "Two cars moving equally fast can have different values of this if they travel in different directions. Scientists describe it using both a number and a direction, such as ten meters per second east. For the point, name this word for speed in a certain direction.", "Velocity", "do not accept just speed"],
 ["Grades 2–4 Practice", "This cell structure has a large piece and a small piece that work together. It follows a message copied from DNA and joins building blocks called amino acids into chains. For the point, name this tiny cell structure that makes proteins, sometimes called a cell's protein factory.", "Ribosome", ""],
 ["Grades 2–4 Practice", "This process changes some matter into energy deep inside stars. It joins tiny atomic centers together and turns hydrogen into helium in the Sun. For the point, name this nuclear process that joins rather than splits atoms and gives the Sun its energy.", "Nuclear fusion", "accept fusion"],
 ["Grades 2–4 Practice", "Iron filings can show the pattern of this invisible region. It surrounds a current-carrying wire or a magnet, and a compass needle lines up with it. For the point, name this field around a magnet where magnetic forces act.", "Magnetic field", ""],
 ["Grades 2–4 Practice", "This organ has four spaces inside it called chambers. Valves keep blood moving the right way, and its strong muscles squeeze again and again. For the point, name this beating organ in your chest that pumps blood around your body.", "Heart", ""],
 ["Grades 2–4 Practice", "Rising warm, wet air helps these storms grow. Their clouds can bring heavy rain and hail, and some strong ones can produce tornadoes. For the point, name these storms with bright lightning flashes and loud claps of thunder.", "Thunderstorms", ""],

 ["Grades 2–4 Practice", "These bacteria can live on pet turtles and other reptiles without making the animals look sick. They can also get into food and cause stomach cramps and diarrhea. For the point, name these food-poisoning bacteria often linked to raw eggs and undercooked chicken, whose name begins with “sal.”", "Salmonella", ""],
 ["Grades 2–4 Practice", "These islands formed as a moving ocean plate passed over a hot spot. They lie in the Pacific Ocean and include Maui, Oahu, and the Big Island. For the point, name this island chain that makes up the fiftieth state of the United States.", "Hawaiian Islands", "accept Hawaii or Hawaiian archipelago"],
 ["Grades 2–4 Practice", "This scientist left empty spaces for elements that had not yet been discovered. He correctly predicted some of their properties and arranged known elements by patterns in how they behaved. For the point, name this Russian scientist famous for making an early periodic table, whose last name begins with M.", "Dmitri Mendeleev", "accept Mendeleev"],
 ["Grades 2–4 Practice", "Tiny pieces called platelets help this liquid form clots that stop bleeding. Its red cells carry oxygen, while its white cells help fight germs. For the point, name this red liquid that your heart pumps through your body.", "Blood", ""],
 ["Grades 2–4 Practice", "This process moves heat by moving the material that carries it. In a pot of water, warmer water can rise while cooler water sinks to take its place. For the point, name this heat transfer by moving liquids or gases, often seen as a rising-and-sinking current.", "Convection", "accept convection currents"],
 ["Grades 2–4 Practice", "Gravity from its planet stretches and squeezes this moon, helping warm its inside. Its cracked, icy surface may cover a deep ocean where scientists wonder whether life could exist. For the point, name this icy moon of Jupiter whose name begins with “Euro.”", "Europa", ""],
 ["Grades 2–4 Practice", "Many harmless members of this kind of bacteria normally live in our intestines. Some harmful kinds can get into food or water, including beef that is not cooked enough. For the point, name these bacteria whose shortened name starts with the letter E, followed by “coli.”", "E. coli", "accept Escherichia coli"],
 ["Grades 2–4 Practice", "Far out at sea, these waves can be low enough that ships hardly notice them. They can grow much taller near shore after an earthquake suddenly moves the ocean floor. For the point, name these powerful ocean waves that can flood a coast, whose name begins with T.", "Tsunamis", ""],
 ["Grades 2–4 Practice", "This scientist found that uranium could mark a covered photographic plate even in the dark. He shared a Nobel Prize with Marie and Pierre Curie, and a unit for measuring radioactivity has his name. For the point, name this French scientist who discovered natural radioactivity, whose first name was Henri.", "Henri Becquerel", "accept Becquerel"],
 ["Grades 2–4 Practice", "Flowering plants spread during this period in Earth's history. Tyrannosaurus rex and Triceratops lived near its end, when a giant asteroid struck Earth. For the point, name this last period of the age of dinosaurs, which came after the Jurassic.", "Cretaceous Period", ""],
 ["Grades 2–4 Practice", "The inside angles of this flat shape add to 180 degrees. Some examples have three equal sides, while others have two equal sides or no equal sides. For the point, name this shape with three straight sides and three corners.", "Triangle", ""],
 ["Grades 2–4 Practice", "This field helps scientists make new medicines and plastics. It includes the study of fuels, sugars, and many molecules found in living things. For the point, name this branch of chemistry that studies carbon compounds and is often paired with the word “inorganic.”", "Organic chemistry", ""],
 ["Grades 2–4 Practice", "Each box in this diagram shows one possible combination of genes from two parents. Scientists put possible gene versions along its top and side to predict the chances of traits in offspring. For the point, name this genetics chart shaped like a square and named after scientist Reginald Punnett.", "Punnett square", ""],
 ["Grades 2–4 Practice", "You can draw this shape by keeping a loop of string tight around two fixed pins. Planets follow paths with this shape, and it has a long axis and a short axis. For the point, name this oval-shaped curve that looks like a stretched circle.", "Ellipse", "prompt on oval by asking “What mathematical curve?”"],
 ["Grades 2–4 Practice", "Oil on moving machine parts can reduce this force. It helps shoes grip the floor and slows a book sliding across a table. For the point, name this rubbing force that makes your hands warm when you rub them together.", "Friction", ""],
 ["Grades 2–4 Practice", "The babies in this animal group are born very tiny and need much more time to develop. Many members live in Australia, and their young drink milk while growing close to their mothers. For the point, name this group of mammals that often carry their babies in pouches, including kangaroos and koalas.", "Marsupials", ""],
 ["Grades 2–4 Practice", "Atoms of this element can join in sheets, chains, or strong crystal shapes. Diamond and graphite are both made of it, and it is found in the molecules of all living things. For the point, name this element with the symbol C, also found in carbon dioxide.", "Carbon", ""],
 ["Grades 2–4 Practice", "A day on this planet lasts only about ten hours. It is mostly made of gas and has moons named Io, Europa, and Ganymede. For the point, name the largest planet in our solar system, known for its Great Red Spot.", "Jupiter", ""],
 ["Grades 2–4 Practice", "A slippery coating protects this organ from the acid inside it. Its muscles churn food, and its digestive juices help break food into smaller parts. For the point, name this food-holding organ in your belly that receives food after you swallow.", "Stomach", ""],
 ["Grades 2–4 Practice", "This property helps explain why a small metal cube can have more mass than a large sponge. It also helps explain why oil floats on water and compares mass with the space something takes up. For the point, name this property found by dividing mass by volume.", "Density", ""],
 ["Grades 2–4 Practice", "Scientists use instruments called seismometers to record these events. They often happen when rocks suddenly slip along a fault, sending waves through Earth. For the point, name these events that make the ground shake and can knock down buildings.", "Earthquakes", ""],
 ["Grades 2–4 Practice", "This animal's name means “wing finger.” It was a prehistoric reptile with toothed jaws and wings supported by very long fingers. For the point, name this ancient flying reptile, a name often used loosely for pterosaurs, beginning with the sound “ter-oh.”", "Pterodactyl", "accept Pterodactylus; prompt on pterosaur by asking “What more specific name?”"],
 ["Grades 2–4 Practice", "Computer programmers can show one of these using a flowchart. It gives clear steps in an order and may tell you to repeat a step or make a choice. For the point, name this step-by-step set of instructions for solving a problem.", "Algorithm", ""],
 ["Grades 2–4 Practice", "At this speed, something could travel around Earth more than seven times in one second. In empty space, it is about 300,000 kilometers per second, and sunlight takes about eight minutes to reach Earth. For the point, name this speed that describes how fast light travels.", "Speed of light", "accept speed of light in a vacuum"],
 ["Grades 2–4 Practice", "Scientists use half-life to describe how quickly this process happens in a large sample. Unstable atoms give off particles or energy during it, and uranium is one material in which it occurs. For the point, name this process of atoms giving off radiation, also called radioactive decay.", "Radioactivity", "accept radioactive decay"],
 ["Grades 2–4 Practice", "A virus causes this disease by attacking the brain and nerves. Infected mammals, including bats and raccoons, can spread it through their saliva, and sick animals may drool heavily. For the point, name this disease that people can catch from an infected animal's bite, sometimes described as making an animal foam at the mouth.", "Rabies", ""],
 ["Grades 2–4 Practice", "Some of these features have wide, gentle slopes, while others form steep cones. They can grow as layers of melted rock and ash build up around an opening in Earth's crust. For the point, name these features, often mountains, that erupt lava and ash.", "Volcanoes", ""],
 ["Grades 2–4 Practice", "An object can have this even while keeping the same speed if it turns. It happens when velocity changes, and a car has it when speeding up or braking. For the point, name how quickly speed or direction changes, a word often used to mean speeding up.", "Acceleration", ""],
 ["Grades 2–4 Practice", "Bits of dust left by this object create meteor showers as Earth passes through them. It is named for an astronomer who realized that several sightings were really the same returning object. For the point, name this famous comet that visits about every 76 years and is expected back in 2061.", "Halley’s comet", "accept 1P/Halley"],
 ["Grades 2–4 Practice", "These infectious agents have no DNA or RNA. They are proteins with the wrong shape that can cause other proteins to fold incorrectly and damage the brain. For the point, name these misfolded proteins linked to mad cow disease, whose name starts with “pri.”", "Prions", "accept prion"],

 ["Grades 2–4 Practice", "Every point on the edge of this shape is the same distance from its center. Its distance around is called the circumference, and a line across its center is a diameter. For the point, name this round, flat shape that you can trace around a coin.", "Circle", ""],

 ["Grades 2–4 Practice", "The largest member of this group, Ganymede, is wider than Mercury. The group includes volcanic Io and icy Europa, and four large members were seen by Galileo through a telescope. For the point, name these moons that orbit Jupiter, the largest planet in our solar system.", "Moons of Jupiter", "accept Jupiter’s moons, Jovian moons, or Galilean moons"],
 ["Grades 2–4 Practice", "Some of these cells swallow germs, while others help the body recognize particular invaders. They travel in blood and body tissues and work as part of the immune system. For the point, name these germ-fighting blood cells, contrasted with red blood cells that carry oxygen.", "White blood cells", "accept leukocytes"],
 ["Grades 2–4 Practice", "Some systems in this field learn patterns from many examples. They can recognize speech, identify objects in photos, and help computers play games. For the point, name this kind of computer technology that performs tasks linked to human intelligence, often shortened to AI.", "Artificial intelligence", "accept AI"],

 ["Grades 2–4 Practice", "This material can cool into smooth, ropy surfaces or rough, sharp ones. It may glow orange when very hot and hardens into rock as it cools. For the point, name melted rock that has come out of a volcano, called magma while it is still underground.", "Lava", ""],
 ["Grades 2–4 Practice", "Some examples glow with their own light, while others reflect nearby starlight. These objects can be places where new stars form, and famous examples include the Orion and Horsehead clouds. For the point, name a huge cloud of gas and dust in space, whose name begins with N.", "Nebulae", "accept nebula or nebulas"],
 ["Grades 2–4 Practice", "The name of this element family means “salt-formers.” Its members belong to Group 17 and include fluorine, bromine, and iodine. For the point, name this group of elements that also includes chlorine, the element used to help keep swimming pools clean.", "Halogens", ""],
 ["Grades 2–4 Practice", "The order of four different chemical building blocks helps this molecule store instructions. It is found in chromosomes, and its shape looks like a twisted ladder. For the point, name this molecule that carries genetic instructions, known by the three letters D, N, and A.", "DNA", "accept deoxyribonucleic acid"],
 ["Grades 2–4 Practice", "This idea says that moving clocks and clocks in different strengths of gravity can tick at different rates. It changed how scientists understand space, time, and gravity and includes the famous equation E equals m c squared. For the point, name Einstein's theory that has “special” and “general” forms.", "Relativity", "accept theory of relativity; prompt on special relativity or general relativity by asking “What theory includes both?”"],

 ["Grades 2–4 Practice", "The number e belongs to this group, but the square root of two does not. These numbers cannot be written as fractions of whole numbers, and their decimal digits never end or repeat in a fixed pattern. For the point, name this special group of numbers that includes pi and e, whose name begins with “trans.”", "Transcendental numbers", "do not accept just irrational numbers"],
 ["Grades 2–4 Practice", "Tiny hairs on these plant parts increase the area that takes in water. Some plants have one thick main one, while others have a branching network of thin ones. For the point, name these usually underground parts that anchor a plant and take in water and minerals.", "Roots", "accept root system"],
 ["Grades 2–4 Practice", "Scientists measure this quantity in units called newtons. Gravity is one example, and changing it can make an object speed up, slow down, or turn. For the point, name this science word for a push or a pull.", "Force", ""],

 ["Grades 2–4 Practice", "This event can leave behind a neutron star or a black hole. For a short time, it can shine as brightly as a whole galaxy and send a star's material flying through space. For the point, name this huge explosion of a star, whose name starts with “super.”", "Supernova", "accept supernova explosion; do not accept just nova"],
 ["Grades 2–4 Practice", "Enzymes in your body are examples of these substances. They help chemical reactions happen faster and are not used up overall in the process. For the point, name a substance that speeds up a chemical reaction, a word beginning with “cat.”", "Catalyst", ""],

/* ================= CHESS ENGINE (rules) ================= */
// Board: 64 squares, index = row*8 + col, row 0 = rank 8 (Black's back row)
const R=i=>i>>3, F=i=>i&7;
function startPosition(){
  const bd=Array(64).fill(null), back="rnbqkbnr";
  for(let f=0;f<8;f++){
    bd[f]={c:"b",t:back[f]}; bd[8+f]={c:"b",t:"p"};
    bd[48+f]={c:"w",t:"p"}; bd[56+f]={c:"w",t:back[f]};
  }
  return {bd, cr:{wK:true,wQ:true,bK:true,bQ:true}, ep:-1};
}
function cloneG(g){ return {bd:g.bd.map(p=>p&&{...p}), cr:{...g.cr}, ep:g.ep}; }
const opp=c=>c==="w"?"b":"w";
const DIRS={b:[[1,1],[1,-1],[-1,1],[-1,-1]], r:[[1,0],[-1,0],[0,1],[0,-1]]};
DIRS.q=DIRS.b.concat(DIRS.r);
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const KG=DIRS.q;

function pseudo(g,i){
  const p=g.bd[i], out=[], r=R(i), f=F(i);
  const add=(to,x)=>out.push(Object.assign({from:i,to},x||{}));
  const enemy=t=>g.bd[t]&&g.bd[t].c!==p.c;
  if(p.t==="p"){
    const dir=p.c==="w"?-1:1, start=p.c==="w"?6:1, last=p.c==="w"?0:7, r1=r+dir;
    if(r1<0||r1>7) return out;
    const t=r1*8+f;
    if(!g.bd[t]){
      add(t, r1===last?{promo:true}:null);
      const t2=(r+2*dir)*8+f;
      if(r===start && !g.bd[t2]) add(t2,{dbl:true});
    }
    for(const df of [-1,1]){
      const ff=f+df; if(ff<0||ff>7) continue;
      const tc=r1*8+ff;
      if(enemy(tc)) add(tc, r1===last?{promo:true}:null);
      else if(tc===g.ep) add(tc,{ep:true});
    }
  } else if(p.t==="n"||p.t==="k"){
    for(const [dr,df] of (p.t==="n"?KN:KG)){
      const rr=r+dr, ff=f+df; if(rr<0||rr>7||ff<0||ff>7) continue;
      const t=rr*8+ff; if(!g.bd[t]||enemy(t)) add(t);
    }
  } else {
    for(const [dr,df] of DIRS[p.t]){
      let rr=r+dr, ff=f+df;
      while(rr>=0&&rr<8&&ff>=0&&ff<8){
        const t=rr*8+ff;
        if(!g.bd[t]) add(t); else { if(enemy(t)) add(t); break; }
        rr+=dr; ff+=df;
      }
    }
  }
  return out;
}
function attacked(g,sq,by){
  for(let i=0;i<64;i++){
    const p=g.bd[i]; if(!p||p.c!==by) continue;
    if(p.t==="p"){
      const dir=p.c==="w"?-1:1;
      if(R(i)+dir===R(sq) && Math.abs(F(i)-F(sq))===1) return true;
    } else if(pseudo(g,i).some(m=>m.to===sq)) return true;
  }
  return false;
}
function kingSq(g,c){ return g.bd.findIndex(p=>p&&p.c===c&&p.t==="k"); }
function inCheck(g,c){ const k=kingSq(g,c); return k>=0 && attacked(g,k,opp(c)); }
function applyMove(g,m){
  const n=cloneG(g), p=n.bd[m.from], cap=n.bd[m.to];
  n.bd[m.to]=p; n.bd[m.from]=null;
  if(m.ep){ n.bd[R(m.from)*8+F(m.to)]=null; }
  if(m.promo){ p.t=m.promoTo||"q"; }
  if(m.castle){
    const row=R(m.from)*8;
    if(m.castle==="K"){ n.bd[row+5]=n.bd[row+7]; n.bd[row+7]=null; }
    else { n.bd[row+3]=n.bd[row]; n.bd[row]=null; }
  }
  n.ep = m.dbl ? (m.from+m.to)/2 : -1;
  if(p.t==="k"){ if(p.c==="w"){n.cr.wK=n.cr.wQ=false;} else {n.cr.bK=n.cr.bQ=false;} }
  for(const s of [m.from,m.to]){
    if(s===63) n.cr.wK=false; if(s===56) n.cr.wQ=false;
    if(s===7) n.cr.bK=false;  if(s===0) n.cr.bQ=false;
  }
  return n;
}
function legalMoves(g,c){
  const out=[];
  for(let i=0;i<64;i++){
    const p=g.bd[i]; if(!p||p.c!==c) continue;
    for(const m of pseudo(g,i)){
      const target=g.bd[m.to];
      // If the other king is left in check (because its player skipped), it can be captured!
      if(target&&target.t==="k"){ out.push(m); continue; }
      if(!inCheck(applyMove(g,m),c)) out.push(m);
    }
  }
  // castling
  const row=c==="w"?56:0, k=row+4, e=opp(c), kp=g.bd[k];
  if(kp&&kp.t==="k"&&kp.c===c&&!inCheck(g,c)){
    const rook=s=>g.bd[s]&&g.bd[s].t==="r"&&g.bd[s].c===c;
    if(g.cr[c+"K"]&&rook(row+7)&&!g.bd[row+5]&&!g.bd[row+6]&&!attacked(g,row+5,e)&&!attacked(g,row+6,e))
      out.push({from:k,to:row+6,castle:"K"});
    if(g.cr[c+"Q"]&&rook(row)&&!g.bd[row+1]&&!g.bd[row+2]&&!g.bd[row+3]&&!attacked(g,row+3,e)&&!attacked(g,row+2,e))
      out.push({from:k,to:row+2,castle:"Q"});
  }
  return out;
}
/* ================= END ENGINE ================= */

/* ================= CHESS BOT ================= */
const VAL={p:100,n:320,b:330,r:500,q:900,k:20000};
const LEVELS={
  easy:  {name:"Easy",   depth:1, noise:80, acc:0.50},
  medium:{name:"Medium", depth:2, noise:15, acc:0.50},
  hard:  {name:"Hard",   depth:3, noise:0,  acc:0.50}
};
function evalPos(g,c){
  let s=0;
  for(let i=0;i<64;i++){
    const p=g.bd[i]; if(!p) continue;
    const r=R(i), f=F(i);
    let v=VAL[p.t];
    const center=(3.5-Math.abs(f-3.5))+(3.5-Math.abs(r-3.5));
    if(p.t==="n"||p.t==="b") v+=center*5;
    if(p.t==="p"){ v+=(p.c==="w"?6-r:r-1)*6 + (f>=2&&f<=5?center*2:0); }
    if(p.t==="q") v+=center*2;
    s+= p.c===c ? v : -v;
  }
  return s;
}
function allPseudo(g,c){
  const out=[];
  for(let i=0;i<64;i++){ const p=g.bd[i]; if(p&&p.c===c) for(const m of pseudo(g,i)) out.push(m); }
  return out;
}
function orderMoves(g,ms){
  return ms.map(m=>({m,s:g.bd[m.to]?VAL[g.bd[m.to].t]*10-VAL[g.bd[m.from].t]:0}))
           .sort((a,b)=>b.s-a.s).map(x=>x.m);
}
function negamax(g,c,d,a,b){
  if(d===0) return evalPos(g,c);
  const ms=orderMoves(g,allPseudo(g,c));
  if(!ms.length) return 0;
  let best=-Infinity;
  for(const m of ms){
    const cap=g.bd[m.to];
    if(cap&&cap.t==="k") return 100000+d;
    const v=-negamax(applyMove(g,m.promo?{...m,promoTo:"q"}:m),opp(c),d-1,-b,-a);
    if(v>best) best=v;
    if(v>a) a=v;
    if(a>=b) break;
  }
  return best;
}
function botPick(g,c,moves,level){
  const L=LEVELS[level];
  let best=null, bestV=-Infinity;
  for(const m of shuffle(moves)){
    const cap=g.bd[m.to];
    let v;
    if(cap&&cap.t==="k") v=1e9;
    else v=-negamax(applyMove(g,m.promo?{...m,promoTo:"q"}:m),opp(c),L.depth-1,-Infinity,Infinity);
    v+=Math.random()*L.noise;
    if(v>bestV){ bestV=v; best=m; }
  }
  return best.promo?{...best,promoTo:"q"}:best;
}
/* ================= END BOT ================= */

  if(!canSpeak) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  voice = vs.find(v=>/en.US/i.test(v.lang)&&/samantha|google|natural|aria|jenny/i.test(v.name))
       || vs.find(v=>/en.US/i.test(v.lang)) || vs[0] || null;

// Turn symbols into words so the voice says them correctly
function sayable(s){
  return s
    .replace(/m\/s²/g," meters per second squared").replace(/km\/h/g," kilometers per hour")
    .replace(/g\/cm³/g," grams per cubic centimeter").replace(/cm³/g," cubic centimeters")
    .replace(/10²³/g,"10 to the 23rd power").replace(/10³/g,"10 cubed").replace(/10⁴/g,"10 to the 4th power")
    .replace(/mc²/g,"m c squared")
    .replace(/°C/g," degrees Celsius").replace(/°F/g," degrees Fahrenheit").replace(/°/g," degrees")
    .replace(/H⁺/g,"H plus").replace(/OH⁻/g,"O H minus")
    .replace(/[₀-₉]/g,d=>" "+"0123456789"["₀₁₂₃₄₅₆₇₈₉".indexOf(d)]+" ")
    .replace(/²/g," squared").replace(/³/g," cubed")
    .replace(/×/g," times ").replace(/÷/g," divided by ").replace(/ = /g," equals ")
    .replace(/−/g,"minus ").replace(/μ/g,"mu").replace(/λ/g,"lambda").replace(/…/g,", blank.")
    .replace(/\s+/g," ").trim();
}
function stopSpeaking(){ if(canSpeak) speechSynthesis.cancel(); speakingKey=null; markSpeaking(); }
function markSpeaking(){ document.querySelectorAll("[data-say]").forEach(b=>b.classList.toggle("on",b.dataset.say===speakingKey)); }
// parts: list of strings read one after another; key marks which 🔊 button glows
function speak(parts,key,onDone){
  if(!canSpeak){ if(onDone) onDone(); return; }
  speechSynthesis.cancel();
  const list=[].concat(parts).filter(Boolean);
  const myKey=key||"x"; speakingKey=myKey; markSpeaking();
  let i=0, finished=false;
  const finish=()=>{ if(finished) return; finished=true; if(speakingKey===myKey){ speakingKey=null; markSpeaking(); } if(onDone) onDone(); };
  const next=()=>{
    if(speakingKey!==myKey) return finish();
    if(i>=list.length) return finish();
    const u=new SpeechSynthesisUtterance(sayable(list[i++]));
    if(voice) u.voice=voice;
    u.lang="en-US";
    u.rate = setup.speed==="slow" ? 0.75 : 0.95;
    u.onend=next; u.onerror=finish;
    speechSynthesis.speak(u);
  };
  next();
  // safety net in case the device never reports the end of speech
  if(onDone){ const total=list.join(" ").length; setTimeout(finish, 4000+total*120); }
}
const L="ABCD";
function questionParts(q){ return q.fr ? [q.text] : [q.text, ...q.opts.map((o,i)=>`${L[i]}. ${o.t}`)]; }
function sayQuestion(){ if(T&&T.q) speak(questionParts(T.q),"q"); }
function sayChoice(i){ if(T&&T.q) speak([`${L[i]}. ${T.q.opts[i].t}`],"c"+i); }
function sayWhy(){ if(T&&T.q){ const right=T.q.fr?T.q.ans:T.q.opts.find(o=>o.ok).t; speak([`The answer is ${right}.`, T.q.why],"why"); } }
function showText(){ T.reveal=true; render(); }
function toggleRead(){ setup.read = setup.read==="on" ? "off" : "on"; saveSetup(); if(setup.read==="off") stopSpeaking(); render(); }

const $app=document.getElementById("app");

const isBot=c=>T.mode==="bot"&&T.botColor===c;
function nameOf(c){
  const base=c==="w"?"White":"Black";
  if(T.mode!=="bot") return base;
  return isBot(c)?`🤖 Bot (${base})`:`You (${base})`;
}
const later=(fn,ms)=>{ const id=gameId; setTimeout(()=>{ if(id===gameId) fn(); },ms); };

/* =========================================================
   SAVING — which questions were asked + the game in progress.
   Saved automatically on this device after every step, and with the 💾 Save button.
   A save file can also be downloaded and loaded back (for browsers that forget).
   ========================================================= */
const SAVE_KEY="scienceChessSave_v1";          // keep this name the same in future versions!
const OLD_SEEN_KEY="scienceChessSeen_bee1";     // progress from the previous version is carried over
// short ID for each question, so progress still matches if questions are added or reordered
function qid(text){ let x=5381; for(let i=0;i<text.length;i++) x=((x<<5)+x+text.charCodeAt(i))|0; return (x>>>0).toString(36); }
const QID=QUESTIONS.map(q=>qid(q[1]));
function storageWorks(){ try{ localStorage.setItem("__sc_test","1"); localStorage.removeItem("__sc_test"); return true; }catch(e){ return false; } }
const STORAGE_OK=storageWorks();
let seenMem=new Set(), savedGame=null, savedAt=0;
(function loadSave(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(d){ seenMem=new Set(d.seen||[]); savedGame=d.game||null; savedAt=d.savedAt||0; }
    const old=JSON.parse(localStorage.getItem(OLD_SEEN_KEY)||"null");
    if(Array.isArray(old)){ old.forEach(t=>seenMem.add(qid(t))); localStorage.removeItem(OLD_SEEN_KEY); }
  }catch(e){}
})();
function loadSeen(){ return seenMem; }
function snapshot(){
  if(!T||!G||T.phase==="over") return null;
  const t={...T, moves:[], sel:-1, promoMove:null, thinking:false};
  return {G, T:t};
}
function saveData(){ return {app:"science-chess", v:1, savedAt:Date.now(), seen:[...seenMem], game:savedGame}; }
// write everything to this device; returns true if it worked
function saveAll(){
  if(T&&G) savedGame=snapshot();
  savedAt=Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData())); return true; }catch(e){ return false; }
}
function saveSeen(){ saveAll(); }
function toast(msg,ms){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d=document.createElement("div"); d.className="toast"; d.innerHTML=msg; document.body.appendChild(d);
  setTimeout(()=>d.remove(), ms||2600);
}
// the 💾 Save button
function saveNow(){
  const ok=saveAll();
  if(ok) toast("💾 Saved! Next time, tap <b>Continue saved game</b> to pick up right here.",3200);
  else {
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="mbox"><h3 style="margin-top:0">⚠️ This page can't save by itself here</h3>
      <p>This usually happens in a private window or when the file is opened as a preview. Download a save file instead, and load it next time.</p>
      <button class="btn" onclick="downloadSave();this.closest('.modal').remove()">⬇️ Download save file</button>
      <button class="btn alt" style="color:#14213d" onclick="this.closest('.modal').remove()">Close</button></div>`;
    document.body.appendChild(m);
  }
}
function downloadSave(){
  if(T&&G) savedGame=snapshot();
  const blob=new Blob([JSON.stringify(saveData())],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="science-chess-save.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("⬇️ Save file downloaded: <b>science-chess-save.json</b>");
}
function pickSaveFile(){ document.getElementById("loadfile").click(); }
function loadSaveFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=="science-chess"||!Array.isArray(d.seen)) throw 0;
      d.seen.forEach(x=>seenMem.add(x));
      if(d.game) savedGame=d.game;
      try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData())); }catch(e){}
      renderSetup(); toast("✅ Save file loaded!");
    }catch(e){ toast("⚠️ That doesn't look like a Science Chess save file."); }
  };
  r.readAsText(f); input.value="";
}
function continueGame(){
  if(!savedGame) return;
  gameId++;
  if(canSpeak){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
  G=savedGame.G; T=savedGame.T;
  T.moves=legalMoves(G,T.turn); T.sel=-1; T.promoMove=null; T.thinking=false; T.msg="💾 Welcome back! Picking up where you left off.";
  if(T.phase==="question"&&T.q&&T.ok===null){ render(); askQuestion(); }
  else if(T.phase==="move"&&isBot(T.turn)){ T.thinking=true; render(); later(botMove,900); }
  else render();
}
function describeSaved(){
  const g=savedGame; if(!g) return "";
  const who = g.T.mode==="bot" ? `You vs 🤖 Bot (${LEVELS[g.T.level].name})` : "2 Players";
  const caps = g.T.caps.w.length+g.T.caps.b.length;
  const when = savedAt ? new Date(savedAt).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
  return `${who} · ${caps} piece${caps===1?"":"s"} captured${when?` · saved ${when}`:""}`;
}

const fits=q=>setup.qtype==="all" || (setup.qtype==="mc")===isMC(q);
function questionsInType(){ return QUESTIONS.filter(fits).length; }
function questionsLeft(){ const s=loadSeen(); return QUESTIONS.filter((q,i)=>fits(q)&&!s.has(QID[i])).length; }
function pickQuestion(){
  const s=loadSeen();
  const inType=QUESTIONS.map((q,i)=>i).filter(i=>fits(QUESTIONS[i]));
  let pool=inType.filter(i=>!s.has(QID[i]));
  if(!pool.length){ inType.forEach(i=>s.delete(QID[i])); pool=inType; T.msg="🎉 Every question has been asked! Starting the list over."; }
  const i=pool[Math.floor(Math.random()*pool.length)];
  s.add(QID[i]); saveAll();
  return QUESTIONS[i];
}
function resetQuestions(){ if(confirm("Start the question list over? Questions you've already seen can come back.")){ loadSeen().clear(); saveAll(); renderSetup(); } }

/* ---------- setup screen ---------- */
function newGame(){ gameId++; stopSpeaking(); if(T&&G){ saveAll(); } T=null; G=null; renderSetup(); }
function renderSetup(){
  const opt=(key,val,label)=>`<button class="seg ${setup[key]===val?"on":""}" onclick="setup.${key}='${val}';saveSetup();renderSetup()">${label}</button>`;
  $app.innerHTML=`
    <h1>🔬 Science Chess</h1>
    ${savedGame?`<div class="card savecard center"><b>💾 You have a saved game</b><br><small class="muted">${describeSaved()}</small>
      <button class="btn" onclick="continueGame()">▶ Continue saved game</button></div>`:""}
    <div class="card">
      <b>Who's playing?</b>
      <div class="segs">${opt("mode","bot","🤖 vs Bot")}${opt("mode","2p","👫 2 Players")}</div>
      ${setup.mode==="bot"?`
        <b>You play as…</b>
        <div class="segs">${opt("you","w","♔ White (go first)")}${opt("you","b","♚ Black")}</div>
        <b>Bot level</b>
        <div class="segs">${opt("level","easy","Easy")}${opt("level","medium","Medium")}${opt("level","hard","Hard")}</div>
        <small class="muted">The bot answers science questions too — at every level it has a 50/50 chance of getting each one right. Higher levels play smarter chess.</small>`:""}
    </div>
    <div class="card">
      <b>🔊 Read questions out loud?</b>
      <div class="segs">${opt("read","on","🔊 Yes")}${opt("read","off","🔇 No")}</div>
      ${setup.read==="on"?`
        <b>Show the question text while it's read?</b>
        <div class="segs">${opt("text","show","👁 Show text")}${opt("text","hide","🎧 Listen only")}</div>
        <b>Reading speed</b>
        <div class="segs">${opt("speed","normal","Normal")}${opt("speed","slow","Slow")}</div>
        <small class="muted">"Listen only" is like a real Science Bee: you hear the question but don't see it until you answer. Tap 🔊 next to any answer choice to hear how it's said.</small>`:""}
      ${canSpeak?"":`<small class="muted">⚠️ This browser can't read aloud.</small>`}
    </div>
    <div class="card">
      <b>📚 Question type</b>
      <div class="segs">${opt("qtype","all","Both")}${opt("qtype","mc","🔤 Multiple choice")}${opt("qtype","fr","🗣 Say the answer")}</div>
      <small class="muted">"Say the answer" is like a real Science Bee buzzer round: say your answer out loud, tap <b>Show answer</b>, then mark whether you got it.</small>
    </div>
    <div class="card center">📚 <b>${questionsLeft()}</b> of <b>${questionsInType()}</b> Science Bee questions still new<br>
      <small class="muted">Questions won't repeat — even in new games — until every one has been asked.</small><br>
      <button class="icon-btn" style="margin-top:8px" onclick="resetQuestions()">↺ Start questions over</button></div>
    <div class="card center">
      ${STORAGE_OK
        ? `<b>💾 Your progress saves on this device</b><br><small class="muted">The game saves automatically, and you can tap 💾 Save anytime. To move to another device, download a save file and load it there.</small>`
        : `<b>⚠️ This browser won't keep your progress</b><br><small class="muted">This happens in a private window or a file preview. Download a save file before you close the page, then load it next time.</small>`}
      <div class="row2"><button class="btn alt" onclick="downloadSave()">⬇️ Download save file</button><button class="btn alt" onclick="pickSaveFile()">⬆️ Load save file</button></div>
      <input type="file" id="loadfile" accept=".json,application/json" style="display:none" onchange="loadSaveFile(this)">
    </div>
    <button class="btn" onclick="startGame()">▶ Start Game</button>
    <button class="btn alt" onclick="showRules()">How to play</button>`;
}
function startGame(){
  if(savedGame && !T && !confirm("Start a new game? Your saved game will be replaced. (Your question progress is kept.)")) return;
  gameId++;
  if(canSpeak){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
  G=startPosition();
  T={mode:setup.mode, botColor:setup.mode==="bot"?opp(setup.you):null, level:setup.level,
     flip:setup.mode==="bot"&&setup.you==="b",
     turn:"w", phase:"question", sel:-1, last:null, moves:[], queue:[], q:null, pick:-1,
     score:{w:{r:0,x:0},b:{r:0,x:0}}, caps:{w:[],b:[]}, result:null, promoMove:null, msg:"", thinking:false};
  startTurn();
}

/* ---------- turn flow ---------- */
function startTurn(){
  T.moves=legalMoves(G,T.turn); T.sel=-1; T.pick=-1; T.thinking=false;
  if(!T.moves.length){
    T.result = inCheck(G,T.turn) ? `Checkmate! ${nameOf(opp(T.turn))} wins! 🏆` : "Stalemate — it's a draw! 🤝";
    T.phase="over"; return render();
  }
  const raw=pickQuestion();
  T.q = isMC(raw)
    ? {cat:raw[0],text:raw[1],why:raw[3]||"",opts:shuffle(raw[2].map((t,i)=>({t,ok:i===0})))}
    : {cat:raw[0],text:raw[1],fr:true,ans:raw[2],note:raw[3]||"",why:"",opts:[]};
  T.phase="question"; T.reveal=false; T.shown=false; T.ok=null;
  render();
  askQuestion();
}
// read the question aloud and, on the bot's turn, let it answer
function askQuestion(){
  const id=gameId;
  if(setup.read==="on"&&canSpeak){
    later(()=>speak(questionParts(T.q),"q", isBot(T.turn) ? ()=>{ if(id===gameId) later(botAnswer,1500); } : null), 400);
  } else if(isBot(T.turn)) later(botAnswer,3000);
}

function answer(i){
  if(T.phase!=="question"||T.pick>=0||isBot(T.turn)) return;
  stopSpeaking();
  if(T.q.fr) return;
  T.pick=i; T.ok=T.q.opts[i].ok;
  T.score[T.turn][T.ok?"r":"x"]++;
  render();
}
// Say-the-answer questions: reveal, then the player marks right or wrong
function showAnswer(){
  if(T.phase!=="question"||!T.q.fr||T.shown||isBot(T.turn)) return;
  stopSpeaking(); T.shown=true; render();
  if(setup.read==="on"&&canSpeak) speak([`The answer is ${T.q.ans}.`],"why");
}
function selfGrade(ok){
  if(T.phase!=="question"||!T.q.fr||!T.shown||T.ok!==null||isBot(T.turn)) return;
  stopSpeaking(); T.ok=ok; T.score[T.turn][ok?"r":"x"]++; render();
}
function afterAnswer(){
  stopSpeaking();
  if(T.ok){ T.phase="move"; T.msg=""; render(); }
  else { T.msg=`${nameOf(T.turn)}'s turn was skipped.`; T.turn=opp(T.turn); startTurn(); }
}

function botAnswer(){
  if(T.phase!=="question"||T.ok!==null) return;
  const right=Math.random()<LEVELS[T.level].acc;
  if(!T.q.fr){
    const idxs=T.q.opts.map((o,i)=>i);
    T.pick = right ? T.q.opts.findIndex(o=>o.ok) : shuffle(idxs.filter(i=>!T.q.opts[i].ok))[0];
  } else T.shown=true;
  T.ok=right; T.score[T.turn][right?"r":"x"]++;
  render();
}
// You tap this button after reading the bot's question and answer
function botContinue(){
  if(!isBot(T.turn)||T.phase!=="question"||T.ok===null) return;
  stopSpeaking();
  if(T.ok){ T.phase="move"; T.thinking=true; T.msg=""; render(); later(botMove,900); }
  else afterAnswer();
}
function botMove(){
  const m=botPick(G,T.turn,T.moves,T.level);
  T.sel=m.from; render();
  later(()=>doMove(m),450);
}

function tap(i){
  if(T.phase!=="move"||isBot(T.turn)) return;
  const p=G.bd[i];
  if(T.sel>=0){
    const m=T.moves.find(m=>m.from===T.sel&&m.to===i);
    if(m){ return m.promo ? (T.promoMove=m, render()) : doMove(m); }
  }
  T.sel = (p&&p.c===T.turn&&T.sel!==i) ? i : -1;
  render();
}
function promote(t){ const m={...T.promoMove,promoTo:t}; T.promoMove=null; doMove(m); }

function doMove(m){
  let captured=G.bd[m.to];
  if(m.ep) captured=G.bd[R(m.from)*8+F(m.to)];
  if(captured) T.caps[T.turn].push(captured);
  G=applyMove(G,m); T.last=m; T.msg="";
  if(captured&&captured.t==="k"){
    T.result=`${nameOf(T.turn)} captured the King and wins! 🏆`; T.phase="over"; return render();
  }
  T.turn=opp(T.turn);
  startTurn();
}

/* ---------- drawing ---------- */
function render(){
  const checkSq = (T.phase!=="over"&&inCheck(G,T.turn)) ? kingSq(G,T.turn) : -1;
  const targets = (T.sel>=0&&!isBot(T.turn)) ? T.moves.filter(m=>m.from===T.sel).map(m=>m.to) : [];
  const bot=isBot(T.turn);
  let sqs="";
  for(let k=0;k<64;k++){
    const i=T.flip?63-k:k;
    const p=G.bd[i], light=(R(i)+F(i))%2===0;
    const cls=["sq",light?"l":"d"];
    if(T.last&&(T.last.from===i||T.last.to===i)) cls.push("last");
    if(i===T.sel) cls.push("sel");
    if(i===checkSq) cls.push("chk");
    const mark = targets.includes(i) ? (p?'<span class="ring"></span>':'<span class="dot"></span>') : "";
    const coord = ((k&7)===0?`<span class="coord r">${8-R(i)}</span>`:"") + ((k>>3)===7?`<span class="coord f">${"abcdefgh"[F(i)]}</span>`:"");
    sqs+=`<div class="${cls.join(" ")}" onclick="tap(${i})">${coord}${p?`<span class="pc ${p.c}">${glyph(p.t)}</span>`:""}${mark}</div>`;
  }
  const pl=c=>`<div class="pl ${T.turn===c&&T.phase!=="over"?"on":""}">
     <b><span class="pc ${c}" style="font-size:1.1rem;display:inline">${glyph("k")}</span> ${nameOf(c)}</b>
     <small>✅ ${T.score[c].r} &nbsp; ❌ ${T.score[c].x}</small>
     <div class="caps">${T.caps[c].map(p=>`<span class="pc ${p.c}" style="font-size:1rem;display:inline">${glyph(p.t)}</span>`).join("")}</div></div>`;

  let status="", panel="";
  if(T.phase==="over"){
    status=`<div class="status">${T.result}</div>`;
    panel=`<button class="btn" onclick="T=null;savedGame=null;startGame()">Play Again</button><button class="btn alt" onclick="savedGame=null;newGame()">Change Settings</button>`;
  } else if(T.phase==="question"){
    status=`<div class="status ${checkSq>=0?"check":""}">${checkSq>=0?"⚠️ CHECK! ":""}${bot?(T.ok===null?"🤖 Bot is thinking…":"🤖 Bot answered — read it, then tap the button"):`${nameOf(T.turn)}: answer to earn your move`}</div>`;
    const q=T.q, done=T.ok!==null, ok=T.ok===true;
    const ansBox = q.fr ? `<div class="ansbox"><b>Answer:</b> ${esc(q.ans)}${q.note?`<br><small>(${esc(q.note)})</small>`:""}${canSpeak?`<br><button class="whysay" data-say="why" onclick="sayWhy()">🔊 Hear the answer</button>`:""}</div>` : "";
    const whyHTML = q.fr ? "" : (q.why?esc(q.why):"")+(canSpeak?`${q.why?"<br>":""}<button class="whysay" data-say="why" onclick="sayWhy()">🔊 Hear the answer</button>`:"");
    const result = bot
      ? `<div class="why ${ok?"good":"bad"}" id="why"><b>${ok?"🤖 The bot got it right — it gets to move.":"🤖 The bot got it wrong — its turn is skipped!"}</b>${whyHTML?"<br>"+whyHTML:""}</div>
         <button class="btn" onclick="botContinue()">${ok?"Let the bot move ➜":"Next — my turn ➜"}</button>`
      : `<div class="why ${ok?"good":"bad"}" id="why"><b>${ok?"✅ Correct! You may move.":"❌ Not quite — your turn is skipped."}</b>${whyHTML?"<br>"+whyHTML:""}</div>
         <button class="btn" onclick="afterAnswer()">${ok?"Make my move ➜":"Skip turn ➜"}</button>`;
    const hide = setup.read==="on" && setup.text==="hide" && !done && !T.reveal && !T.shown;
    const speakOK = canSpeak;
    const qBlock = hide
      ? `<div class="listen">🎧 Listen to the question…
           <div class="qtools">${speakOK?`<button data-say="q" onclick="sayQuestion()">🔊 Read again</button>`:""}<button onclick="showText()">👁 Show text</button></div></div>`
      : `<div class="qhead"><p class="q">${esc(q.text)}</p>${speakOK?`<button class="say" data-say="q" onclick="sayQuestion()" title="Read the question out loud" aria-label="Read the question out loud">🔊</button>`:""}</div>`;
    panel=`<div class="qcard"><span class="tag">${bot?"🤖 Bot's question · ":""}${esc(CATNAME[q.cat]||q.cat)}</span>${qBlock}
      ${q.fr ? (bot
          ? (done ? ansBox : `<p class="hint">🤖 The bot is thinking of the answer…</p>`)
          : (!T.shown
              ? `<p class="hint">🗣 Say your answer out loud, then check it.</p><button class="btn" onclick="showAnswer()">👀 Show answer</button>`
              : ansBox + (done ? "" : `<p class="hint">Did you get it right? Be honest!</p><div class="grade"><button class="btn good" onclick="selfGrade(true)">✅ I got it</button><button class="btn bad" onclick="selfGrade(false)">❌ I missed it</button></div>`)))
        : ""}
      ${q.opts.map((o,i)=>{let c=""; if(done){ if(o.ok) c="right"; else if(i===T.pick) c="wrong"; else c="dim"; }
         return `<div class="crow"><button class="choice ${c}" onclick="answer(${i})" ${done||bot?"disabled":""}><span class="letter">${L[i]}</span>${esc(o.t)}</button>${speakOK?`<button class="say" data-say="c${i}" onclick="sayChoice(${i})" title="Hear how to say it" aria-label="Read choice ${L[i]} out loud">🔊</button>`:""}</div>`;}).join("")}
      ${done?result:""}
    </div>`;
  } else {
    status=`<div class="status ${checkSq>=0?"check":""}">${checkSq>=0?"⚠️ CHECK! ":""}${bot?"🤖 Bot is moving…":`✅ ${nameOf(T.turn)}, tap a piece to move`}</div>`;
  }
  const msg = `<div class="status" style="font-weight:600;color:var(--muted);font-size:.9rem">${T.msg||"&nbsp;"}</div>`;
  const promoModal = T.promoMove ? `<div class="modal"><div class="mbox"><b>Promote your pawn to…</b>
     <div class="promo">${["q","r","b","n"].map(t=>`<button onclick="promote('${t}')"><span class="pc ${T.turn}">${glyph(t)}</span></button>`).join("")}</div></div></div>` : "";

  $app.innerHTML=`
    <div class="top"><span class="ttl">🔬 <span class="long">Science </span>Chess</span>
      <span>${canSpeak?`<button class="icon-btn" onclick="toggleRead()" aria-label="Turn reading aloud on or off">${setup.read==="on"?"🔊":"🔇"}</button> `:""}<button class="icon-btn" onclick="saveNow()" aria-label="Save game">💾 Save</button><button class="icon-btn" onclick="showRules()">Rules</button><button class="icon-btn" onclick="confirmNew()">New</button></span></div>
    <div class="players">${pl(T.flip?"b":"w")}${pl(T.flip?"w":"b")}</div>
    ${T.mode==="bot"?`<div class="center muted" style="font-size:.85rem">Bot level: ${LEVELS[T.level].name}</div>`:""}
    <div class="statusbox">${msg}${status}</div>
    <div class="board ${T.phase==="move"&&!bot?"":"locked"}">${sqs}</div>
    <div class="below">${T.phase==="over"?panel:""}</div>
    ${T.phase==="question"?`<div class="qwrap">${panel}</div>`:""}
    ${promoModal}`;
  markSpeaking();
  saveAll();
}

function showRules(){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="mbox" style="text-align:left"><h3 style="margin-top:0">How to play</h3>
    <p>1. White goes first.</p>
    <p>2. Before you move, answer a science question. <b>Right</b> = you move a piece. <b>Wrong</b> = your turn is skipped.</p>
    <p>3. Everything else is normal chess — castling, en passant, and pawn promotion included.</p>
    <p>🗣 Some questions have no choices — say your answer out loud, tap <b>Show answer</b>, then tap <b>I got it</b> or <b>I missed it</b>. Playing a friend? Let them check your answer!</p>
    <p>💾 The game saves automatically. Tap <b>💾 Save</b> anytime, then choose <b>Continue saved game</b> next time.</p>
    <p>🔊 Questions can be read out loud. Tap 🔊 next to any choice to hear how it's pronounced — great Science Bee practice! Use the 🔊/🔇 button at the top to turn reading on or off.</p>
    <p>🤖 Playing the bot? It has to answer science questions too, and it can miss them!</p>
    <p>⚠️ If you're in check and miss your question, your opponent can <b>capture your King</b> and win!</p>
    <button class="btn" onclick="this.closest('.modal').remove()">Got it</button></div>`;
  document.body.appendChild(m);
}
function confirmNew(){ if(confirm("Start a new game?")) newGame(); }

if(typeof QUESTIONS==="undefined"||!QUESTIONS.length){
  document.getElementById("app").innerHTML='<div class="card" style="text-align:center"><h2>⚠️ Questions not found</h2><p>The question list has a typo.</p><p class="muted">Check that every question line ends with a comma and every quote mark is closed.</p></div>';
} else newGame();
</script>
