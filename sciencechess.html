<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Science Chess</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#14213d; --bg2:#1f4e79; --card:#ffffff14; --line:#ffffff26;
  --text:#fff; --muted:#cdd8ec; --accent:#ffcf3f; --accent-dark:#b88a00;
  --good:#3ddc84; --bad:#ff5a6e;
  --light:#f0d9b5; --dark:#b58863;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Fredoka',system-ui,-apple-system,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:520px;margin:0 auto;padding:12px 14px 40px}
h1{margin:.2em 0;text-align:center;color:var(--accent);font-size:2.2rem;text-shadow:0 3px 0 #0006}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.icon-btn{background:#00000040;border:0;color:#fff;border-radius:99px;padding:7px 12px;font:inherit;cursor:pointer}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.95rem}
.pl.on{border-color:var(--accent);box-shadow:0 0 0 2px #ffcf3f55}
.pl b{display:block}
.pl small{color:var(--muted)}
.caps{height:2.6em;overflow:hidden;font-size:.9rem;letter-spacing:-2px;line-height:1.3em}
.status{text-align:center;font-weight:700;font-size:1.05rem;margin:0;line-height:1.3em}
.statusbox{height:4em;display:flex;flex-direction:column;justify-content:center;margin:4px 0;overflow:hidden}
.qwrap{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  max-height:78vh;overflow-y:auto;background:linear-gradient(transparent,#000a 18px);display:flex;justify-content:center}
.qwrap .qcard{width:100%;max-width:496px;margin:8px 0 0;box-shadow:0 -6px 30px #0007}
.below{min-height:140px}
.status.check{color:var(--bad)}
.crow{display:flex;gap:6px;align-items:stretch}
.crow .choice{flex:1;min-width:0}
.say{flex:0 0 44px;margin:7px 0;border-radius:12px;border:2px solid #d5deec;background:#eef3fb;color:#14213d;font-size:1.15rem;cursor:pointer}
.say:active{transform:scale(.95)}
.say.on{background:var(--accent);border-color:var(--accent)}
.letter{display:inline-block;width:1.5em;font-weight:700;opacity:.6}
.listen{background:#eef3fb;border-radius:12px;padding:12px;margin:8px 0;text-align:center;font-weight:600}
.qtools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.qtools button,.whysay{background:#14213d;color:#fff;border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qhead .q{flex:1}
.whysay{padding:4px 10px;font-size:.8rem;margin-top:6px}
.qcard{background:#ffffffee;color:#14213d;border-radius:18px;padding:14px;margin:8px 0}
.tag{display:inline-block;background:#1f4e79;color:#fff;font-size:.8rem;border-radius:99px;padding:3px 10px}
.q{font-size:1.15rem;font-weight:600;margin:8px 0}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:7px 0;border-radius:12px;border:2px solid #d5deec;
  background:#fff;color:#14213d;font:inherit;font-size:1.02rem;cursor:pointer}
.choice.right{background:var(--good);border-color:var(--good);color:#073b20;font-weight:700}
.choice.wrong{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.choice.dim{opacity:.5}
.why{border-radius:12px;padding:10px 12px;margin-top:6px}
.why.good{background:#dcfbe9}.why.bad{background:#ffe1e5}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:0;font:inherit;font-size:1.1rem;font-weight:700;
  background:var(--accent);color:#2a1a00;box-shadow:0 5px 0 var(--accent-dark);margin:10px 0 4px;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.alt{background:#ffffff22;color:#fff;box-shadow:0 5px 0 #0005}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:auto;width:100%;
  border:4px solid #3b2a1a;border-radius:0;position:relative;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
  aspect-ratio:1/1;min-width:0;min-height:0;overflow:hidden}
@supports not (aspect-ratio:1/1){ .sq{height:0;padding-bottom:100%} .sq>*{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)} }
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last.l{background:#f6eb72}.sq.last.d{background:#dcc34b}
.sq.sel{box-shadow:inset 0 0 0 4px #2f80ed}
.sq.chk{background:radial-gradient(circle,#ff3b3b 0%,#ff3b3b88 45%,transparent 75%)}
.pc{font-size:min(9vw,46px);line-height:1;pointer-events:none;display:inline-block;text-align:center}
.sq .pc{display:block}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 2px 2px #0008}
.pc.b{color:#1a1a1a;text-shadow:0 0 2px #fff8}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:#0000004d;pointer-events:none}
.ring{position:absolute;inset:6%;border-radius:50%;border:5px solid #0000004d;pointer-events:none}
.coord{position:absolute;font-size:.6rem;font-weight:700;opacity:.7;pointer-events:none}
.coord.f{right:3px;bottom:1px}.coord.r{left:3px;top:1px}
.sq.l .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.locked .sq{cursor:default}
.locked::after{content:"";position:absolute;inset:0;background:#0000002a}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.mbox{background:#fff;color:#14213d;border-radius:18px;padding:18px;text-align:center;max-width:360px;width:100%}
.promo{display:flex;justify-content:space-around;margin-top:10px}
.promo button{font-size:2.6rem;background:#f0d9b5;border:0;border-radius:12px;width:62px;height:62px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;line-height:1.45}
.muted{color:var(--muted)}
.segs{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.seg{flex:1;min-width:90px;padding:11px 8px;border-radius:12px;border:2px solid var(--line);background:#00000030;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.seg.on{background:var(--accent);color:#2a1a00;border-color:var(--accent)}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   QUESTION BANK — Middle School Science Bee (grades 5–8)
   Format: [category, question, [RIGHT answer, wrong, wrong, wrong], "explanation"]
   Put the right answer FIRST — the game shuffles the choices.
   Categories: earth, weather, space, chem, phys, life, eco, animals, health, sci
   ========================================================= */
const QUESTIONS = [
 // ===== BIOLOGY & LIFE SCIENCE =====
 ["life","Which organelle builds proteins?",["Ribosome","Lysosome","Vacuole","Cell wall"],"Ribosomes read instructions from RNA and link amino acids into proteins."],
 ["life","Which organelle packages proteins and ships them where they're needed?",["Golgi apparatus","Endoplasmic reticulum","Nucleolus","Chloroplast"],"The Golgi apparatus works like the cell's post office."],
 ["life","What network of membranes moves materials through the cell, and is 'rough' when covered in ribosomes?",["Endoplasmic reticulum","Golgi apparatus","Cytoskeleton","Nuclear envelope"],"Rough ER helps make proteins. Smooth ER makes lipids."],
 ["life","Which organelle holds digestive enzymes that break down waste and worn-out parts?",["Lysosome","Ribosome","Centriole","Chloroplast"],"Lysosomes are the cell's cleanup crew."],
 ["life","What thin, flexible layer controls what enters and leaves every cell?",["Cell membrane","Cell wall","Nuclear envelope","Cytoplasm"],"The membrane is selectively permeable — it lets only some things through."],
 ["life","What molecule do cells use as their main energy 'currency'?",["ATP","DNA","RNA","Chlorophyll"],"ATP stands for adenosine triphosphate."],
 ["life","Cellular respiration uses glucose and oxygen and releases…",["Carbon dioxide, water and energy","Oxygen and sugar","Nitrogen and light","Only heat"],"It's roughly the reverse of photosynthesis and happens in the mitochondria."],
 ["life","What are the two products of photosynthesis?",["Glucose and oxygen","Carbon dioxide and water","Protein and fat","Nitrogen and ATP only"],"6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂."],
 ["life","The diffusion of water across a cell membrane is called…",["Osmosis","Active transport","Photosynthesis","Mitosis"],"Water moves toward the side with more dissolved particles."],
 ["life","Particles moving from an area of high concentration to low concentration is…",["Diffusion","Active transport","Endocytosis","Mitosis"],"Diffusion needs no energy from the cell."],
 ["life","Moving materials across a membrane against the concentration gradient, using energy, is…",["Active transport","Diffusion","Osmosis","Passive transport"],"Cells spend ATP to pump materials 'uphill.'"],
 ["life","Which type of cell division makes sex cells with half the normal chromosomes?",["Meiosis","Mitosis","Binary fission","Budding"],"Meiosis makes eggs and sperm."],
 ["life","How many chromosomes are in a human egg or sperm cell?",["23","46","12","92"],"When egg and sperm join, the zygote has 46."],
 ["life","In which phase of mitosis do chromosomes line up across the middle of the cell?",["Metaphase","Prophase","Anaphase","Telophase"],"Tip: Metaphase = Middle."],
 ["life","The final step of cell division, when the cytoplasm splits in two, is…",["Cytokinesis","Interphase","Prophase","Replication"],"'Cyto' means cell and 'kinesis' means movement."],
 ["life","Different versions of the same gene are called…",["Alleles","Chromosomes","Phenotypes","Ribosomes"],"For example, a gene for flower color might have a purple allele and a white allele."],
 ["life","An organism's genetic makeup, such as Tt, is its…",["Genotype","Phenotype","Karyotype","Habitat"],"The genotype is the letters. The phenotype is what you see."],
 ["life","The physical trait you can observe, such as tall or short, is the…",["Phenotype","Genotype","Allele","Gene pool"],"Phenotype comes from genotype plus environment."],
 ["life","An organism with two identical alleles, like TT or tt, is…",["Homozygous","Heterozygous","Hybrid","Recessive only"],"'Homo' means same."],
 ["life","An organism with two different alleles, like Tt, is…",["Heterozygous","Homozygous","Purebred","Dominant only"],"'Hetero' means different."],
 ["life","If two Tt parents are crossed, what fraction of offspring is expected to show the recessive trait?",["1/4","1/2","3/4","None"],"The Punnett square gives TT, Tt, Tt, tt — only tt shows the recessive trait."],
 ["life","What chart is used to predict the possible genotypes of offspring?",["Punnett square","Cladogram","Food web","Pedigree map"],"It was invented by Reginald Punnett."],
 ["life","A random change in an organism's DNA sequence is a…",["Mutation","Adaptation","Allele","Clone"],"Mutations can be harmful, helpful or have no effect."],
 ["life","In DNA, adenine (A) always pairs with…",["Thymine (T)","Guanine (G)","Cytosine (C)","Uracil (U)"],"A pairs with T, and G pairs with C."],
 ["life","In DNA, guanine (G) always pairs with…",["Cytosine (C)","Adenine (A)","Thymine (T)","Uracil (U)"],"G–C pairs are held by three hydrogen bonds."],
 ["life","Which base does RNA use instead of thymine?",["Uracil","Adenine","Guanine","Cytosine"],"RNA has A, U, G and C."],
 ["life","Into how many domains are all living things classified?",["3","5","6","2"],"Bacteria, Archaea and Eukarya."],
 ["life","Which domain includes single-celled extremophiles that can live in boiling hot springs?",["Archaea","Eukarya","Plantae","Fungi"],"Archaea look like bacteria but are chemically very different."],
 ["life","Similar body structures from a common ancestor, like a human arm and a bat wing, are…",["Homologous structures","Analogous structures","Vestigial structures","Mutations"],"They're evidence for evolution."],
 ["life","A branching diagram that shows evolutionary relationships is a…",["Cladogram","Punnett square","Karyotype","Pie chart"],"Branch points show shared ancestors."],
 ["life","An organism keeping stable internal conditions, like body temperature, is…",["Homeostasis","Metamorphosis","Photosynthesis","Succession"],"Sweating and shivering help maintain homeostasis."],
 ["life","Seed plants that make cones instead of flowers, like pines, are…",["Gymnosperms","Angiosperms","Bryophytes","Ferns"],"'Gymnosperm' means 'naked seed.'"],
 ["life","Flowering plants that grow seeds inside fruits are…",["Angiosperms","Gymnosperms","Mosses","Algae"],"Angiosperms are the largest group of plants."],
 ["life","Plants like corn and grass with one seed leaf and parallel leaf veins are…",["Monocots","Dicots","Gymnosperms","Bryophytes"],"Dicots have two seed leaves and net-like veins."],
 ["life","Plants with no tubes to carry water, such as mosses, are called…",["Nonvascular plants","Vascular plants","Angiosperms","Conifers"],"Without xylem and phloem, mosses stay small and live in damp places."],
 ["life","The single cell formed when an egg and sperm join is a…",["Zygote","Embryo","Gamete","Spore"],"The zygote divides to become an embryo."],
 ["life","Why are viruses usually NOT considered living?",["They can't reproduce on their own","They are too big","They contain no genetic material","They only live in water"],"Viruses must hijack a host cell to make copies."],
 ["life","Which protist moves and eats using 'false feet' called pseudopods?",["Amoeba","Paramecium","Euglena","Volvox"],"The amoeba stretches its cytoplasm to crawl and engulf food."],
 ["life","Which protist has a whip-like flagellum, an eyespot and can photosynthesize?",["Euglena","Amoeba","Paramecium","Plasmodium"],"Euglena can act like a plant or an animal."],
 ["life","Which slipper-shaped protist moves using tiny hairs called cilia?",["Paramecium","Amoeba","Euglena","Diatom"],"Cilia beat like oars."],
 ["life","Rod-shaped bacteria are called…",["Bacilli","Cocci","Spirilla","Archaea"],"Cocci are round and spirilla are spiral-shaped."],
 ["life","Fungi cell walls are made of a tough material called…",["Chitin","Cellulose","Keratin","Starch"],"Chitin is also in insect exoskeletons."],
 ["life","When yeast ferments sugar, it produces carbon dioxide and…",["Alcohol (ethanol)","Oxygen","Chlorophyll","Protein"],"The CO₂ bubbles make bread dough rise."],
 ["life","Which special cells open and close a leaf's stomata?",["Guard cells","Root hairs","Xylem cells","Pollen grains"],"Guard cells swell with water to open the pore."],
 ["life","What is the main sugar plants make in photosynthesis?",["Glucose","Sucrose only","Lactose","Fructose only"],"Its formula is C₆H₁₂O₆."],

 // ===== EARTH SCIENCE =====
 ["earth","At which type of plate boundary do plates move apart?",["Divergent","Convergent","Transform","Subduction"],"New crust forms as magma rises between the plates."],
 ["earth","At which type of plate boundary do plates collide?",["Convergent","Divergent","Transform","Hot spot"],"Collisions build mountains and trenches."],
 ["earth","The San Andreas Fault is which kind of plate boundary?",["Transform","Divergent","Convergent","Hot spot"],"At transform boundaries, plates slide past each other."],
 ["earth","When a denser plate sinks beneath another plate, it is called…",["Subduction","Seafloor spreading","Weathering","Deposition"],"Subduction zones create deep ocean trenches and volcanoes."],
 ["earth","What long underwater mountain chain forms where plates pull apart?",["Mid-ocean ridge","Ocean trench","Continental shelf","Abyssal plain"],"The Mid-Atlantic Ridge runs down the middle of the Atlantic."],
 ["earth","Which scientist first proposed the theory of continental drift?",["Alfred Wegener","Charles Lyell","James Hutton","Harry Hess"],"Wegener proposed it in 1912, using fossils and matching coastlines as evidence."],
 ["earth","New ocean floor forming at mid-ocean ridges and moving outward is called…",["Seafloor spreading","Subduction","Erosion","Continental drift"],"Harry Hess proposed it in the 1960s."],
 ["earth","What is thought to drive the movement of tectonic plates?",["Convection currents in the mantle","Ocean tides","Wind","The Moon's gravity"],"Hot mantle rock rises and cooler rock sinks."],
 ["earth","Which earthquake waves travel fastest and arrive first?",["P waves","S waves","Surface waves","Love waves"],"P stands for primary."],
 ["earth","Which earthquake waves cannot travel through liquid?",["S waves","P waves","Sound waves","Radio waves"],"S waves vanishing at the outer core showed scientists that it's liquid."],
 ["earth","Which earthquake scale rates intensity by the damage people observe?",["Modified Mercalli scale","Moment magnitude scale","Mohs scale","Beaufort scale"],"It uses Roman numerals from I to XII."],
 ["earth","What scale do scientists use today to measure the total energy an earthquake releases?",["Moment magnitude scale","Mercalli scale","Mohs scale","Saffir-Simpson scale"],"It replaced the Richter scale for large quakes."],
 ["earth","The rigid outer layer made of the crust and the uppermost mantle is the…",["Lithosphere","Asthenosphere","Outer core","Hydrosphere"],"'Litho' means rock."],
 ["earth","The soft, slowly flowing layer of mantle that the plates ride on is the…",["Asthenosphere","Lithosphere","Inner core","Stratosphere"],"'Astheno' means weak."],
 ["earth","What is the boundary between Earth's crust and mantle called?",["Moho (Mohorovičić discontinuity)","Ring of Fire","Equator","Gutenberg line"],"Andrija Mohorovičić discovered it in 1909."],
 ["earth","What is the state of Earth's outer core?",["Liquid","Solid","Gas","Plasma"],"The moving liquid iron makes Earth's magnetic field."],
 ["earth","A broad volcano with gentle slopes, like Mauna Loa, is a…",["Shield volcano","Cinder cone","Stratovolcano","Caldera"],"Runny basalt lava builds shield volcanoes."],
 ["earth","A tall, steep volcano built of alternating lava and ash layers, like Mount Fuji, is a…",["Stratovolcano (composite)","Shield volcano","Cinder cone","Fissure"],"Stratovolcanoes often erupt explosively."],
 ["earth","Which chain of islands formed as a plate moved over a hot spot?",["Hawaiian Islands","Japan","Philippines","British Isles"],"The Big Island is the youngest and still active."],
 ["earth","Igneous rock that cools slowly underground and has large crystals is called…",["Intrusive","Extrusive","Clastic","Foliated"],"Granite is intrusive."],
 ["earth","Igneous rock that cools quickly at the surface and has small crystals is called…",["Extrusive","Intrusive","Metamorphic","Organic"],"Basalt and obsidian are extrusive."],
 ["earth","What dark, fine-grained extrusive rock makes up most of the ocean floor?",["Basalt","Granite","Limestone","Marble"],"It forms from lava at mid-ocean ridges."],
 ["earth","Shale changed by heat and pressure becomes which metamorphic rock?",["Slate","Marble","Quartzite","Granite"],"Slate splits into flat sheets and was used for chalkboards."],
 ["earth","Which mineral fizzes when you put a drop of acid on it?",["Calcite","Quartz","Feldspar","Talc"],"Calcite is calcium carbonate, the main mineral in limestone."],
 ["earth","A mineral that splits evenly along flat surfaces is showing…",["Cleavage","Fracture","Luster","Streak"],"Minerals that break unevenly show fracture."],
 ["earth","Which mineral peels into thin, flexible, see-through sheets?",["Mica","Quartz","Halite","Pyrite"],"Mica has perfect cleavage in one direction."],
 ["earth","Which mineral is naturally magnetic?",["Magnetite","Quartz","Calcite","Gypsum"],"It's an iron oxide."],
 ["earth","Which shiny gold-colored mineral is nicknamed 'fool's gold'?",["Pyrite","Mica","Topaz","Galena"],"Pyrite's streak is greenish-black, while real gold's streak is gold."],
 ["earth","Which mineral group makes up most of Earth's crust?",["Silicates","Carbonates","Oxides","Sulfides"],"Silicates contain silicon and oxygen — quartz and feldspar are examples."],
 ["earth","Rubies and sapphires are both forms of which mineral?",["Corundum","Quartz","Diamond","Beryl"],"Corundum is a 9 on the Mohs scale."],
 ["earth","Non-bird dinosaurs went extinct at the end of which period, about 66 million years ago?",["Cretaceous","Jurassic","Triassic","Cambrian"],"An asteroid impact near Mexico is the leading explanation."],
 ["earth","Which era is known as the 'Age of Reptiles' or age of dinosaurs?",["Mesozoic","Cenozoic","Paleozoic","Precambrian"],"It includes the Triassic, Jurassic and Cretaceous periods."],
 ["earth","Which era do we live in now?",["Cenozoic","Mesozoic","Paleozoic","Precambrian"],"It's called the 'Age of Mammals.'"],
 ["earth","Which method uses radioactive decay to find the age of rocks?",["Radiometric dating","Relative dating","Carbon copying","Stratification"],"It gives an age in years, called the absolute age."],
 ["earth","What is a half-life?",["Time for half of a radioactive sample to decay","Half the age of Earth","Half a rock layer","Time for a fossil to form"],"Carbon-14 has a half-life of about 5,730 years."],
 ["earth","A fossil from a species that was widespread but lived only a short time is an…",["Index fossil","Trace fossil","Cast fossil","Living fossil"],"Index fossils help match rock layers by age."],
 ["earth","About how old is Earth?",["4.6 billion years","6,000 years","460 million years","46 billion years"],"Scientists dated meteorites and the oldest rocks."],
 ["earth","What shape of valley do glaciers carve?",["U-shaped","V-shaped","W-shaped","Flat-topped"],"Rivers carve V-shaped valleys."],
 ["earth","A ridge of rock and soil left behind by a glacier is a…",["Moraine","Delta","Mesa","Levee"],"Glaciers push and drop debris called till."],
 ["earth","On a topographic map, lines that connect points of equal elevation are…",["Contour lines","Latitude lines","Fault lines","Isobars"],"Close lines mean steep land."],
 ["earth","Lines of latitude measure distance…",["North or south of the equator","East or west of the prime meridian","Above sea level","Below the crust"],"The equator is 0° latitude."],
 ["earth","The prime meridian, 0° longitude, runs through…",["Greenwich, England","Paris, France","New York, USA","Cairo, Egypt"],"It was chosen in 1884."],
 ["earth","The topmost soil layer, rich in humus, is called the…",["A horizon (topsoil)","B horizon (subsoil)","C horizon","Bedrock"],"Soil layers are called horizons."],
 ["earth","Which scientist is called the 'father of modern geology'?",["James Hutton","Alfred Wegener","Charles Darwin","Isaac Newton"],"Hutton argued that Earth is very old and slowly changing."],
 ["earth","Which rock type forms from layers of compressed shells of ocean organisms?",["Limestone","Granite","Basalt","Obsidian"],"The White Cliffs of Dover are chalk, a kind of limestone."],

 // ===== WEATHER & ATMOSPHERE =====
 ["weather","What is the curving of winds caused by Earth's rotation called?",["Coriolis effect","Greenhouse effect","Doppler effect","Jet effect"],"It curves winds right in the Northern Hemisphere."],
 ["weather","In the Northern Hemisphere, which way do hurricanes spin?",["Counterclockwise","Clockwise","They don't spin","Straight up and down"],"They spin clockwise in the Southern Hemisphere."],
 ["weather","Which prevailing winds move most weather across the United States from west to east?",["Westerlies","Trade winds","Polar easterlies","Doldrums"],"Westerlies blow between about 30° and 60° latitude."],
 ["weather","Which steady winds blow toward the equator and helped sailing ships cross the Atlantic?",["Trade winds","Westerlies","Polar easterlies","Jet stream"],"They blow from the east in the tropics."],
 ["weather","What is the calm, windless area near the equator called?",["Doldrums","Horse latitudes","Jet stream","Trade belt"],"Sailing ships could get stuck there for weeks."],
 ["weather","A warm, humid air mass that forms over tropical ocean is labeled…",["Maritime tropical (mT)","Continental polar (cP)","Continental tropical (cT)","Maritime polar (mP)"],"'Maritime' means over water and 'tropical' means warm."],
 ["weather","A cold, dry air mass that forms over northern Canada is labeled…",["Continental polar (cP)","Maritime tropical (mT)","Maritime polar (mP)","Continental tropical (cT)"],"'Continental' means over land and 'polar' means cold."],
 ["weather","Which front brings slow, steady rain as warm air gently slides over cold air?",["Warm front","Cold front","Occluded front","Dry line"],"On maps, it's a red line with half-circles."],
 ["weather","What is a front that stays in place for days called?",["Stationary front","Occluded front","Cold front","Warm front"],"It can bring several days of clouds and rain."],
 ["weather","When a cold front catches up to a warm front, it forms an…",["Occluded front","Stationary front","Dry line","Squall line"],"On maps, it's a purple line."],
 ["weather","On a weather map, a blue line with triangles shows a…",["Cold front","Warm front","Stationary front","Occluded front"],"The triangles point the way the front is moving."],
 ["weather","A high-pressure system usually brings…",["Clear, calm weather","Thunderstorms","Hurricanes","Heavy snow"],"Sinking air in a high stops clouds from forming."],
 ["weather","A low-pressure system usually brings…",["Clouds and stormy weather","Clear skies","No wind","Drought"],"Rising air cools and forms clouds."],
 ["weather","What is the average air pressure at sea level?",["About 1013 millibars","About 100 millibars","About 5000 millibars","About 13 millibars"],"That's also about 29.92 inches of mercury."],
 ["weather","The temperature at which air becomes saturated and dew forms is the…",["Dew point","Freezing point","Boiling point","Melting point"],"A dew point close to the air temperature means high humidity."],
 ["weather","A relative humidity of 100% means the air is…",["Saturated with water vapor","Completely dry","Full of oxygen","Below freezing"],"At 100%, fog or dew can form."],
 ["weather","Which instrument uses a wet-bulb and a dry-bulb thermometer to find humidity?",["Psychrometer","Barometer","Anemometer","Altimeter"],"Evaporation cools the wet bulb more in dry air."],

/* ================= CHESS ENGINE (rules) ================= */
// Board: 64 squares, index = row*8 + col, row 0 = rank 8 (Black's back row)
const R=i=>i>>3, F=i=>i&7;
function startPosition(){
  const bd=Array(64).fill(null), back="rnbqkbnr";
  for(let f=0;f<8;f++){
    bd[f]={c:"b",t:back[f]}; bd[8+f]={c:"b",t:"p"};
    bd[48+f]={c:"w",t:"p"}; bd[56+f]={c:"w",t:back[f]};
  }
  return {bd, cr:{wK:true,wQ:true,bK:true,bQ:true}, ep:-1};
}
function cloneG(g){ return {bd:g.bd.map(p=>p&&{...p}), cr:{...g.cr}, ep:g.ep}; }
const opp=c=>c==="w"?"b":"w";
const DIRS={b:[[1,1],[1,-1],[-1,1],[-1,-1]], r:[[1,0],[-1,0],[0,1],[0,-1]]};
DIRS.q=DIRS.b.concat(DIRS.r);
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const KG=DIRS.q;

function pseudo(g,i){
  const p=g.bd[i], out=[], r=R(i), f=F(i);
  const add=(to,x)=>out.push(Object.assign({from:i,to},x||{}));
  const enemy=t=>g.bd[t]&&g.bd[t].c!==p.c;
  if(p.t==="p"){
    const dir=p.c==="w"?-1:1, start=p.c==="w"?6:1, last=p.c==="w"?0:7, r1=r+dir;
    if(r1<0||r1>7) return out;
    const t=r1*8+f;
    if(!g.bd[t]){
      add(t, r1===last?{promo:true}:null);
      const t2=(r+2*dir)*8+f;
      if(r===start && !g.bd[t2]) add(t2,{dbl:true});
    }
    for(const df of [-1,1]){
      const ff=f+df; if(ff<0||ff>7) continue;
      const tc=r1*8+ff;
      if(enemy(tc)) add(tc, r1===last?{promo:true}:null);
      else if(tc===g.ep) add(tc,{ep:true});
    }
  } else if(p.t==="n"||p.t==="k"){
    for(const [dr,df] of (p.t==="n"?KN:KG)){
      const rr=r+dr, ff=f+df; if(rr<0||rr>7||ff<0||ff>7) continue;
      const t=rr*8+ff; if(!g.bd[t]||enemy(t)) add(t);
    }
  } else {
    for(const [dr,df] of DIRS[p.t]){
      let rr=r+dr, ff=f+df;
      while(rr>=0&&rr<8&&ff>=0&&ff<8){
        const t=rr*8+ff;
        if(!g.bd[t]) add(t); else { if(enemy(t)) add(t); break; }
        rr+=dr; ff+=df;
      }
    }
  }
  return out;
}
function attacked(g,sq,by){
  for(let i=0;i<64;i++){
    const p=g.bd[i]; if(!p||p.c!==by) continue;
    if(p.t==="p"){
      const dir=p.c==="w"?-1:1;
      if(R(i)+dir===R(sq) && Math.abs(F(i)-F(sq))===1) return true;
    } else if(pseudo(g,i).some(m=>m.to===sq)) return true;
  }
  return false;
}
function kingSq(g,c){ return g.bd.findIndex(p=>p&&p.c===c&&p.t==="k"); }
function inCheck(g,c){ const k=kingSq(g,c); return k>=0 && attacked(g,k,opp(c)); }
function applyMove(g,m){
  const n=cloneG(g), p=n.bd[m.from], cap=n.bd[m.to];
  n.bd[m.to]=p; n.bd[m.from]=null;
  if(m.ep){ n.bd[R(m.from)*8+F(m.to)]=null; }
  if(m.promo){ p.t=m.promoTo||"q"; }
  if(m.castle){
    const row=R(m.from)*8;
    if(m.castle==="K"){ n.bd[row+5]=n.bd[row+7]; n.bd[row+7]=null; }
    else { n.bd[row+3]=n.bd[row]; n.bd[row]=null; }
  }
  n.ep = m.dbl ? (m.from+m.to)/2 : -1;
  if(p.t==="k"){ if(p.c==="w"){n.cr.wK=n.cr.wQ=false;} else {n.cr.bK=n.cr.bQ=false;} }
  for(const s of [m.from,m.to]){
    if(s===63) n.cr.wK=false; if(s===56) n.cr.wQ=false;
    if(s===7) n.cr.bK=false;  if(s===0) n.cr.bQ=false;
  }
  return n;
}
function legalMoves(g,c){
  const out=[];
  for(let i=0;i<64;i++){
    const p=g.bd[i]; if(!p||p.c!==c) continue;
    for(const m of pseudo(g,i)){
      const target=g.bd[m.to];
      // If the other king is left in check (because its player skipped), it can be captured!
      if(target&&target.t==="k"){ out.push(m); continue; }
      if(!inCheck(applyMove(g,m),c)) out.push(m);
    }
  }
  // castling
  const row=c==="w"?56:0, k=row+4, e=opp(c), kp=g.bd[k];
  if(kp&&kp.t==="k"&&kp.c===c&&!inCheck(g,c)){
    const rook=s=>g.bd[s]&&g.bd[s].t==="r"&&g.bd[s].c===c;
    if(g.cr[c+"K"]&&rook(row+7)&&!g.bd[row+5]&&!g.bd[row+6]&&!attacked(g,row+5,e)&&!attacked(g,row+6,e))
      out.push({from:k,to:row+6,castle:"K"});
    if(g.cr[c+"Q"]&&rook(row)&&!g.bd[row+1]&&!g.bd[row+2]&&!g.bd[row+3]&&!attacked(g,row+3,e)&&!attacked(g,row+2,e))
      out.push({from:k,to:row+2,castle:"Q"});
  }
  return out;
}
/* ================= END ENGINE ================= */

/* ================= CHESS BOT ================= */
const VAL={p:100,n:320,b:330,r:500,q:900,k:20000};
const LEVELS={
  easy:  {name:"Easy",   depth:1, noise:80, acc:0.50},
  medium:{name:"Medium", depth:2, noise:15, acc:0.50},
  hard:  {name:"Hard",   depth:3, noise:0,  acc:0.50}
};
function evalPos(g,c){
  let s=0;
  for(let i=0;i<64;i++){
    const p=g.bd[i]; if(!p) continue;
    const r=R(i), f=F(i);
    let v=VAL[p.t];
    const center=(3.5-Math.abs(f-3.5))+(3.5-Math.abs(r-3.5));
    if(p.t==="n"||p.t==="b") v+=center*5;
    if(p.t==="p"){ v+=(p.c==="w"?6-r:r-1)*6 + (f>=2&&f<=5?center*2:0); }
    if(p.t==="q") v+=center*2;
    s+= p.c===c ? v : -v;
  }
  return s;
}
function allPseudo(g,c){
  const out=[];
  for(let i=0;i<64;i++){ const p=g.bd[i]; if(p&&p.c===c) for(const m of pseudo(g,i)) out.push(m); }
  return out;
}
function orderMoves(g,ms){
  return ms.map(m=>({m,s:g.bd[m.to]?VAL[g.bd[m.to].t]*10-VAL[g.bd[m.from].t]:0}))
           .sort((a,b)=>b.s-a.s).map(x=>x.m);
}
function negamax(g,c,d,a,b){
  if(d===0) return evalPos(g,c);
  const ms=orderMoves(g,allPseudo(g,c));
  if(!ms.length) return 0;
  let best=-Infinity;
  for(const m of ms){
    const cap=g.bd[m.to];
    if(cap&&cap.t==="k") return 100000+d;
    const v=-negamax(applyMove(g,m.promo?{...m,promoTo:"q"}:m),opp(c),d-1,-b,-a);
    if(v>best) best=v;
    if(v>a) a=v;
    if(a>=b) break;
  }
  return best;
}
function botPick(g,c,moves,level){
  const L=LEVELS[level];
  let best=null, bestV=-Infinity;
  for(const m of shuffle(moves)){
    const cap=g.bd[m.to];
    let v;
    if(cap&&cap.t==="k") v=1e9;
    else v=-negamax(applyMove(g,m.promo?{...m,promoTo:"q"}:m),opp(c),L.depth-1,-Infinity,Infinity);
    v+=Math.random()*L.noise;
    if(v>bestV){ bestV=v; best=m; }
  }
  return best.promo?{...best,promoTo:"q"}:best;
}
/* ================= END BOT ================= */

const GLYPH={k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const glyph=t=>GLYPH[t]+"︎";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const canSpeak = typeof window!=="undefined" && "speechSynthesis" in window;
let voice=null, speakingKey=null;
function pickVoice(){
  if(!canSpeak) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  voice = vs.find(v=>/en.US/i.test(v.lang)&&/samantha|google|natural|aria|jenny/i.test(v.name))
       || vs.find(v=>/en.US/i.test(v.lang)) || vs[0] || null;
}
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
// Turn symbols into words so the voice says them correctly
function sayable(s){
  return s
    .replace(/m\/s²/g," meters per second squared").replace(/km\/h/g," kilometers per hour")
    .replace(/g\/cm³/g," grams per cubic centimeter").replace(/cm³/g," cubic centimeters")
    .replace(/10²³/g,"10 to the 23rd power").replace(/10³/g,"10 cubed").replace(/10⁴/g,"10 to the 4th power")
    .replace(/mc²/g,"m c squared")
    .replace(/°C/g," degrees Celsius").replace(/°F/g," degrees Fahrenheit").replace(/°/g," degrees")
    .replace(/H⁺/g,"H plus").replace(/OH⁻/g,"O H minus")
    .replace(/[₀-₉]/g,d=>" "+"0123456789"["₀₁₂₃₄₅₆₇₈₉".indexOf(d)]+" ")
    .replace(/²/g," squared").replace(/³/g," cubed")
    .replace(/×/g," times ").replace(/÷/g," divided by ").replace(/ = /g," equals ")
    .replace(/−/g,"minus ").replace(/μ/g,"mu").replace(/λ/g,"lambda").replace(/…/g,", blank.")
    .replace(/\s+/g," ").trim();
}
function stopSpeaking(){ if(canSpeak) speechSynthesis.cancel(); speakingKey=null; markSpeaking(); }
function markSpeaking(){ document.querySelectorAll("[data-say]").forEach(b=>b.classList.toggle("on",b.dataset.say===speakingKey)); }
// parts: list of strings read one after another; key marks which 🔊 button glows
function speak(parts,key,onDone){
  if(!canSpeak){ if(onDone) onDone(); return; }
  speechSynthesis.cancel();
  const list=[].concat(parts).filter(Boolean);
  const myKey=key||"x"; speakingKey=myKey; markSpeaking();
  let i=0, finished=false;
  const finish=()=>{ if(finished) return; finished=true; if(speakingKey===myKey){ speakingKey=null; markSpeaking(); } if(onDone) onDone(); };
  const next=()=>{
    if(speakingKey!==myKey) return finish();
    if(i>=list.length) return finish();
    const u=new SpeechSynthesisUtterance(sayable(list[i++]));
    if(voice) u.voice=voice;
    u.lang="en-US";
    u.rate = setup.speed==="slow" ? 0.75 : 0.95;
    u.onend=next; u.onerror=finish;
    speechSynthesis.speak(u);
  };
  next();
  // safety net in case the device never reports the end of speech
  if(onDone){ const total=list.join(" ").length; setTimeout(finish, 4000+total*120); }
}
const L="ABCD";
function questionParts(q){ return [q.text, ...q.opts.map((o,i)=>`${L[i]}. ${o.t}`)]; }
function sayQuestion(){ if(T&&T.q) speak(questionParts(T.q),"q"); }
function sayChoice(i){ if(T&&T.q) speak([`${L[i]}. ${T.q.opts[i].t}`],"c"+i); }
function sayWhy(){ if(T&&T.q){ const ok=T.q.opts[T.pick]&&T.q.opts[T.pick].ok, right=T.q.opts.find(o=>o.ok).t; speak([`The answer is ${right}.`, T.q.why],"why"); } }
function showText(){ T.reveal=true; render(); }
function toggleRead(){ setup.read = setup.read==="on" ? "off" : "on"; saveSetup(); if(setup.read==="off") stopSpeaking(); render(); }

const $app=document.getElementById("app");

const isBot=c=>T.mode==="bot"&&T.botColor===c;
function nameOf(c){
  const base=c==="w"?"White":"Black";
  if(T.mode!=="bot") return base;
  return isBot(c)?`🤖 Bot (${base})`:`You (${base})`;
}
const later=(fn,ms)=>{ const id=gameId; setTimeout(()=>{ if(id===gameId) fn(); },ms); };

/* ---------- questions never repeat until all have been asked ---------- */
const SEEN_KEY="scienceChessSeen_ms1";
let seenMem=null;
function loadSeen(){
  if(seenMem) return seenMem;
  try{ seenMem=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]")); }catch(e){ seenMem=new Set(); }
  return seenMem;
}
function saveSeen(){ try{ localStorage.setItem(SEEN_KEY,JSON.stringify([...seenMem])); }catch(e){} }
function questionsLeft(){ const s=loadSeen(); return QUESTIONS.filter(q=>!s.has(q[1])).length; }
function pickQuestion(){
  const s=loadSeen();
  let pool=QUESTIONS.filter(q=>!s.has(q[1]));
  if(!pool.length){ s.clear(); pool=QUESTIONS.slice(); T.msg="🎉 Every question has been asked! Starting the list over."; }
  const raw=pool[Math.floor(Math.random()*pool.length)];
  s.add(raw[1]); saveSeen();
  return raw;
}
function resetQuestions(){ if(confirm("Start the question list over? Questions you've already seen can come back.")){ loadSeen().clear(); saveSeen(); renderSetup(); } }

function startGame(){
  gameId++;
  if(canSpeak){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
  G=startPosition();
  T={mode:setup.mode, botColor:setup.mode==="bot"?opp(setup.you):null, level:setup.level,
     flip:setup.mode==="bot"&&setup.you==="b",
     turn:"w", phase:"question", sel:-1, last:null, moves:[], queue:[], q:null, pick:-1,
     score:{w:{r:0,x:0},b:{r:0,x:0}}, caps:{w:[],b:[]}, result:null, promoMove:null, msg:"", thinking:false};
  startTurn();
}

/* ---------- turn flow ---------- */
function startTurn(){
  T.moves=legalMoves(G,T.turn); T.sel=-1; T.pick=-1; T.thinking=false;
  if(!T.moves.length){
    T.result = inCheck(G,T.turn) ? `Checkmate! ${nameOf(opp(T.turn))} wins! 🏆` : "Stalemate — it's a draw! 🤝";
    T.phase="over"; return render();
  }
  const raw=pickQuestion();
  T.q={cat:raw[0],text:raw[1],why:raw[3],opts:shuffle(raw[2].map((t,i)=>({t,ok:i===0})))};
  T.phase="question"; T.reveal=false;
  render();
  const id=gameId;
  if(setup.read==="on"&&canSpeak){
    later(()=>speak(questionParts(T.q),"q", isBot(T.turn) ? ()=>{ if(id===gameId) later(botAnswer,1500); } : null), 400);
  } else if(isBot(T.turn)) later(botAnswer,3000);
}

function answer(i){
  if(T.phase!=="question"||T.pick>=0||isBot(T.turn)) return;
  stopSpeaking();
  T.pick=i;
  T.score[T.turn][T.q.opts[i].ok?"r":"x"]++;
  render();
}
function afterAnswer(){
  stopSpeaking();
  if(T.q.opts[T.pick].ok){ T.phase="move"; T.msg=""; render(); }
  else { T.msg=`${nameOf(T.turn)}'s turn was skipped.`; T.turn=opp(T.turn); startTurn(); }
}

function botAnswer(){
  if(T.phase!=="question"||T.pick>=0) return;
  const right=Math.random()<LEVELS[T.level].acc;
  const idxs=T.q.opts.map((o,i)=>i);
  const pick = right ? T.q.opts.findIndex(o=>o.ok) : shuffle(idxs.filter(i=>!T.q.opts[i].ok))[0];
  T.pick=pick; T.score[T.turn][right?"r":"x"]++;
  render();
}
// You tap this button after reading the bot's question and answer
function botContinue(){
  if(!isBot(T.turn)||T.phase!=="question"||T.pick<0) return;
  stopSpeaking();
  if(T.q.opts[T.pick].ok){ T.phase="move"; T.thinking=true; T.msg=""; render(); later(botMove,900); }
  else afterAnswer();
}
function botMove(){
  const m=botPick(G,T.turn,T.moves,T.level);
  T.sel=m.from; render();
  later(()=>doMove(m),450);
}

function tap(i){
  if(T.phase!=="move"||isBot(T.turn)) return;
  const p=G.bd[i];
  if(T.sel>=0){
    const m=T.moves.find(m=>m.from===T.sel&&m.to===i);
    if(m){ return m.promo ? (T.promoMove=m, render()) : doMove(m); }
  }
  T.sel = (p&&p.c===T.turn&&T.sel!==i) ? i : -1;
  render();
}
function promote(t){ const m={...T.promoMove,promoTo:t}; T.promoMove=null; doMove(m); }

function doMove(m){
  let captured=G.bd[m.to];
  if(m.ep) captured=G.bd[R(m.from)*8+F(m.to)];
  if(captured) T.caps[T.turn].push(captured);
  G=applyMove(G,m); T.last=m; T.msg="";
  if(captured&&captured.t==="k"){
    T.result=`${nameOf(T.turn)} captured the King and wins! 🏆`; T.phase="over"; return render();
  }
  T.turn=opp(T.turn);
  startTurn();
}

/* ---------- drawing ---------- */
function render(){
  const checkSq = (T.phase!=="over"&&inCheck(G,T.turn)) ? kingSq(G,T.turn) : -1;
  const targets = (T.sel>=0&&!isBot(T.turn)) ? T.moves.filter(m=>m.from===T.sel).map(m=>m.to) : [];
  const bot=isBot(T.turn);
  let sqs="";
  for(let k=0;k<64;k++){
    const i=T.flip?63-k:k;
    const p=G.bd[i], light=(R(i)+F(i))%2===0;
    const cls=["sq",light?"l":"d"];
    if(T.last&&(T.last.from===i||T.last.to===i)) cls.push("last");
    if(i===T.sel) cls.push("sel");
    if(i===checkSq) cls.push("chk");
    const mark = targets.includes(i) ? (p?'<span class="ring"></span>':'<span class="dot"></span>') : "";
    const coord = ((k&7)===0?`<span class="coord r">${8-R(i)}</span>`:"") + ((k>>3)===7?`<span class="coord f">${"abcdefgh"[F(i)]}</span>`:"");
    sqs+=`<div class="${cls.join(" ")}" onclick="tap(${i})">${coord}${p?`<span class="pc ${p.c}">${glyph(p.t)}</span>`:""}${mark}</div>`;
  }
  const pl=c=>`<div class="pl ${T.turn===c&&T.phase!=="over"?"on":""}">
     <b><span class="pc ${c}" style="font-size:1.1rem;display:inline">${glyph("k")}</span> ${nameOf(c)}</b>
     <small>✅ ${T.score[c].r} &nbsp; ❌ ${T.score[c].x}</small>
     <div class="caps">${T.caps[c].map(p=>`<span class="pc ${p.c}" style="font-size:1rem;display:inline">${glyph(p.t)}</span>`).join("")}</div></div>`;

  let status="", panel="";
  if(T.phase==="over"){
    status=`<div class="status">${T.result}</div>`;
    panel=`<button class="btn" onclick="startGame()">Play Again</button><button class="btn alt" onclick="newGame()">Change Settings</button>`;
  } else if(T.phase==="question"){
    status=`<div class="status ${checkSq>=0?"check":""}">${checkSq>=0?"⚠️ CHECK! ":""}${bot?(T.pick<0?"🤖 Bot is reading the question…":"🤖 Bot answered — read it, then tap the button"):`${nameOf(T.turn)}: answer to earn your move`}</div>`;
    const q=T.q, done=T.pick>=0, ok=done&&q.opts[T.pick].ok;
    const result = bot
      ? `<div class="why ${ok?"good":"bad"}" id="why"><b>${ok?"🤖 The bot got it right — it gets to move.":"🤖 The bot got it wrong — its turn is skipped!"}</b><br>${q.why}${canSpeak?`<br><button class="whysay" data-say="why" onclick="sayWhy()">🔊 Hear the answer</button>`:""}</div>
         <button class="btn" onclick="botContinue()">${ok?"Let the bot move ➜":"Next — my turn ➜"}</button>`
      : `<div class="why ${ok?"good":"bad"}" id="why"><b>${ok?"✅ Correct! You may move.":"❌ Not quite — your turn is skipped."}</b><br>${q.why}${canSpeak?`<br><button class="whysay" data-say="why" onclick="sayWhy()">🔊 Hear the answer</button>`:""}</div>
         <button class="btn" onclick="afterAnswer()">${ok?"Make my move ➜":"Skip turn ➜"}</button>`;
    const hide = setup.read==="on" && setup.text==="hide" && !done && !T.reveal;
    const speakOK = canSpeak;
    const qBlock = hide
      ? `<div class="listen">🎧 Listen to the question…
           <div class="qtools">${speakOK?`<button data-say="q" onclick="sayQuestion()">🔊 Read again</button>`:""}<button onclick="showText()">👁 Show text</button></div></div>`
      : `<div class="qhead"><p class="q">${q.text}</p>${speakOK?`<button class="say" data-say="q" onclick="sayQuestion()" title="Read the question out loud" aria-label="Read the question out loud">🔊</button>`:""}</div>`;
    panel=`<div class="qcard"><span class="tag">${bot?"🤖 Bot's question · ":""}${CATNAME[q.cat]}</span>${qBlock}
      ${q.opts.map((o,i)=>{let c=""; if(done){ if(o.ok) c="right"; else if(i===T.pick) c="wrong"; else c="dim"; }
         return `<div class="crow"><button class="choice ${c}" onclick="answer(${i})" ${done||bot?"disabled":""}><span class="letter">${L[i]}</span>${o.t}</button>${speakOK?`<button class="say" data-say="c${i}" onclick="sayChoice(${i})" title="Hear how to say it" aria-label="Read choice ${L[i]} out loud">🔊</button>`:""}</div>`;}).join("")}
      ${done?result:""}
    </div>`;
  } else {
    status=`<div class="status ${checkSq>=0?"check":""}">${checkSq>=0?"⚠️ CHECK! ":""}${bot?"🤖 Bot is moving…":`✅ ${nameOf(T.turn)}, tap a piece to move`}</div>`;
  }
  const msg = `<div class="status" style="font-weight:600;color:var(--muted);font-size:.9rem">${T.msg||"&nbsp;"}</div>`;
  const promoModal = T.promoMove ? `<div class="modal"><div class="mbox"><b>Promote your pawn to…</b>
     <div class="promo">${["q","r","b","n"].map(t=>`<button onclick="promote('${t}')"><span class="pc ${T.turn}">${glyph(t)}</span></button>`).join("")}</div></div></div>` : "";

  $app.innerHTML=`
    <div class="top"><span style="font-weight:700;font-size:1.25rem;color:var(--accent)">🔬 Science Chess</span>
      <span>${canSpeak?`<button class="icon-btn" onclick="toggleRead()" aria-label="Turn reading aloud on or off">${setup.read==="on"?"🔊":"🔇"}</button> `:""}<button class="icon-btn" onclick="showRules()">Rules</button> <button class="icon-btn" onclick="confirmNew()">New</button></span></div>
    <div class="players">${pl(T.flip?"b":"w")}${pl(T.flip?"w":"b")}</div>
    ${T.mode==="bot"?`<div class="center muted" style="font-size:.85rem">Bot level: ${LEVELS[T.level].name}</div>`:""}
    <div class="statusbox">${msg}${status}</div>
    <div class="board ${T.phase==="move"&&!bot?"":"locked"}">${sqs}</div>
    <div class="below">${T.phase==="over"?panel:""}</div>
    ${T.phase==="question"?`<div class="qwrap">${panel}</div>`:""}
    ${promoModal}`;
  markSpeaking();
}

function showRules(){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="mbox" style="text-align:left"><h3 style="margin-top:0">How to play</h3>
    <p>1. White goes first.</p>
    <p>2. Before you move, answer a science question. <b>Right</b> = you move a piece. <b>Wrong</b> = your turn is skipped.</p>
    <p>3. Everything else is normal chess — castling, en passant, and pawn promotion included.</p>
    <p>🔊 Questions can be read out loud. Tap 🔊 next to any choice to hear how it's pronounced — great Science Bee practice! Use the 🔊/🔇 button at the top to turn reading on or off.</p>
    <p>🤖 Playing the bot? It has to answer science questions too, and it can miss them!</p>
    <p>⚠️ If you're in check and miss your question, your opponent can <b>capture your King</b> and win!</p>
    <button class="btn" onclick="this.closest('.modal').remove()">Got it</button></div>`;
  document.body.appendChild(m);
}
function confirmNew(){ if(confirm("Start a new game?")) newGame(); }

if(typeof QUESTIONS==="undefined"||!QUESTIONS.length){
  document.getElementById("app").innerHTML='<div class="card" style="text-align:center"><h2>⚠️ Questions not found</h2><p>The question list has a typo.</p><p class="muted">Check that every question line ends with a comma and every quote mark is closed.</p></div>';
} else newGame();
</script>
</body>
</html>
